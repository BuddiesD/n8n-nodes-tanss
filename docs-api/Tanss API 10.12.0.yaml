  /api/remoteSupports/v1:
    post:
      tags:
        - remote supports
      summary: Creates/imports a remote support into the database
      description: >
        Stores/imports a remote support of an external system into the TANSS
        database.

        * if `userId` is given, the api can try to "translate" it to a TANSS employee (use route `/api/remoteSupports/v1/assignEmployee` to set the matchings)

        * if `deviceId` is given, the api can try to "translate" it into a TANSS company and assignment (use route `/api/remoteSupports/v1/assignDevice` to set the matchings)
      requestBody:
        description: remote object to be saved
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object represents a remote support
              properties:
                id:
                  type: integer
                remoteMaintenanceId:
                  type: string
                  description: >
                    "Identifier" used by the remote systems to identify this
                    remote support
                  example: 643F4G1H1-423HT12-123HGDTRB
                typeId:
                  type: integer
                  description: >
                    "Id" of the external remote support system, which is defined
                    in the TANSS administration ("Externe
                    Fernwartungs-Anbindungen verwalten").

                    This field can't be set, as the Api token was created for a specific "type" and this value is fix.
                  example: 1001
                userId:
                  type: string
                  description: >
                    "Identifier string" of the technician who has done this
                    remote support. This can be used to "translate" the
                    identifier of the technician

                    to a TANSS employee id
                  example: Buchberger, Sven
                userName:
                  type: string
                  description: name of the technician who has done this remote support, this is
                    mainly used for displaying issues
                  example: Buchberger, Sven (Softwareentwicklung)
                employeeId:
                  type: integer
                  description: >
                    Id of the technician who has done this remote support (TANSS
                    employee id). This can be omitted if the id is not known

                    or the "userId" can be "translated"
                deviceId:
                  type: string
                  description: >
                    "Identifier string" or unique name of the device the remote
                    support was executed for. This can be used via a
                    "translation table" to

                    get the company and/or assignment.
                  example: DC-2003-01
                deviceName:
                  type: string
                  description: Simply the name of the device the remote support was executed for.
                    This is mainly used for displying issues.
                  example: DC-2003-01 Domänencontroller
                companyId:
                  type: integer
                  description: id of the company for this remote support
                linkTypeId:
                  type: integer
                  description: LinkTypeId of the assignment (if known)
                linkId:
                  type: integer
                  description: LinkId of the assignment (if known)
                startTime:
                  type: integer
                  format: timestamp
                  description: Unix timestamp of the begin for this remote support
                  example: 1568289600
                endTime:
                  type: integer
                  format: timestamp
                  description: Unix timestamp of the end for this remote support
                  example: 1568291520
                comment:
                  type: string
                  description: (optional) comment of the remote support
                  example: >
                    Test-Fernwartung, durchgeführt von Sven mit dem
                    DomänenController.

                    Div. Konfigurationen überprüft, Updates installiert.

                    Alles OK.
      responses:
        "201":
          description: remote support was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1remoteSupports~1v1/post/requestBody/content/application~1\
                      json/schema"
    put:
      tags:
        - remote supports
      summary: Get list of remote supports
      description: Gets a list of remote supports calls based on misc. filter settings
      requestBody:
        description: filter settings
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object is used to get remote supports based on filter settings
              properties:
                timeframe:
                  $ref: "#/paths/~1api~1calls~1v1/put/requestBody/content/application~1json/schem\
                    a/properties/timeframe"
                employeeId:
                  type: integer
                  description: only shows remote supports of a certain employee
                companyId:
                  type: integer
                  description: only shows remote supports of this company
                typeId:
                  type: integer
                  description: If set, only shows remote supports of this type
                text:
                  type: string
                  description: text filter for remote supports
      responses:
        "200":
          description: list of all retrived remote supports
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1remoteSupports~1v1/post/requestBody/content/application~1\
                        json/schema"
  "/api/remoteSupports/v1/{remoteSupportId}":
    get:
      tags:
        - remote supports
      summary: Get remote support by id
      description: |
        Gets a remote support from the database (based on the id)
      parameters:
        - in: path
          name: remoteSupportId
          required: true
          description: Id of the remote support to be fetched
          schema:
            type: integer
      responses:
        "200":
          description: remote support was succesfully fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1remoteSupports~1v1/post/requestBody/content/application~1\
                      json/schema"
    put:
      tags:
        - remote supports
      summary: Updates a remote support
      description: Updates a remote support by id and sets the new values
      parameters:
        - in: path
          name: remoteSupportId
          required: true
          description: Id of the remote support to be updated
          schema:
            type: integer
      requestBody:
        description: new values for the remote support object
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1api~1remoteSupports~1v1/post/requestBody/content/application~1\
                json/schema"
      responses:
        "200":
          description: updated remote support object
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1remoteSupports~1v1/post/requestBody/content/application~1\
                      json/schema"
    delete:
      tags:
        - remote supports
      summary: Delete remote support
      description: Deletes a remote support by id. This can only be done for
        "external" remote support (type >= 1000)
      parameters:
        - in: path
          name: remoteSupportId
          required: true
          description: Id of the remote support to be deleted
          schema:
            type: integer
      responses:
        "204":
          description: object was succesfully deleted
        "403":
          description: return a "forbidden" if external id is not present or not from an
            "external" remote support system
  /api/remoteSupports/v1/assignDevice:
    get:
      tags:
        - remote supports
      summary: Gets all device assignments
      description: >
        This call gets all device assignments of the given remote support
        "type". A list is returned containing all information

        how to match a `deviceId` for the given remote support type to a TANSS company / assignment.

        The "type" is fix and is stored in the used Api token.
      responses:
        "200":
          description: a list of all device assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      type: object
                      description: >
                        Object containing the "translation" of a deviceId based
                        on a remote support "type" to a TANSS company.
                        Optionally,

                        a linkTypeId / linkId (assignment) can be given as well, so the system knows exactly to which device the deviceId refers.
                      properties:
                        deviceId:
                          type: string
                          description: DeviceId which is transferred in a remote support object
                          example: DC-2003-01
                        companyId:
                          type: integer
                          description: Company which this deviceId refers to
                          example: 10413
                        linkTypeId:
                          type: integer
                          description: LinkTypeId of the assignment which this deviceId refers to
                          example: 1
                        linkId:
                          type: integer
                          description: LinkId of the assignment which this deviceId refers to
                          example: 1004
    post:
      tags:
        - remote supports
      summary: Creates a device assignment
      description: >
        This call creates an entry in a "translation table" that allows
        identification of a remote support to a company / assignment

        based of the `deviceId`
      requestBody:
        description: object containing the assignment of "`deviceId` -> `company` /
          `linkTypeId` / `linkId`"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1api~1remoteSupports~1v1~1assignDevice/get/responses/200/conten\
                t/application~1json/schema/properties/content/items"
      responses:
        "201":
          description: assignment object created succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1remoteSupports~1v1~1assignDevice/get/responses/200/conten\
                      t/application~1json/schema/properties/content/items"
    delete:
      tags:
        - remote supports
      summary: Deletes a device assignment
      description: >
        This call deletes an entry in a "translation table" that allows
        identification of a remote support to a company / assignment

        based of the `deviceId`
      requestBody:
        description: object containing the assignment of "`type` + `deviceId` ->
          `company` / `linkTypeId` / `linkId`"
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Identifies a "translation" of a deviceId based on a remote
                support "type" to a TANSS company.
              properties:
                deviceId:
                  type: string
                  description: DeviceId which is transferred in a remote support object
                  example: DC-2003-01
      responses:
        "204":
          description: assignment object deleted succesfully
        "403":
          description: error if assignment was not found
  /api/remoteSupports/v1/assignEmployee:
    get:
      tags:
        - remote supports
      summary: Gets all technician assignments
      description: >
        This call gets all employee assignments for the current remote support
        "type".

        The "type" is fix and is stored in the used Api token.
      responses:
        "200":
          description: list of all remote support type employee assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      type: object
                      description: >
                        Object containing the "translation" of a userId based on
                        a remote support "type" to a TANSS employee /
                        technician.
                      properties:
                        userId:
                          type: string
                          description: UserId which is transferred in a remote support object
                          example: Buchberger, Sven
                        employeeId:
                          type: integer
                          description: Employee id of the TANSS user
                          example: 2
    post:
      tags:
        - remote supports
      summary: Creates a technician assignment
      description: >
        This call creates an entry in a "translation table" that allows
        identification of a TANSS employee based on a `userId`

        of a remote support
      requestBody:
        description: object containing the assignment of "`type` + `userId` -> `employeeId`"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1api~1remoteSupports~1v1~1assignEmployee/get/responses/200/cont\
                ent/application~1json/schema/properties/content/items"
      responses:
        "201":
          description: assignment object created succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1remoteSupports~1v1~1assignEmployee/get/responses/200/cont\
                      ent/application~1json/schema/properties/content/items"
    delete:
      tags:
        - remote supports
      summary: Delets a technician assignment
      description: >
        This call deletes an entry in a "translation table" that allows
        identification of a TANSS employee based on a `userId`

        of a remote support
      requestBody:
        description: object containing the assignment of "`type` + `userId` -> `employeeId`"
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Identifies a "translation" of a userId based on a remote support
                "type" to a TANSS employee / technician.
              properties:
                userId:
                  type: string
                  description: UserId which is transferred in a remote support object
                  example: Buchberger, Sven
      responses:
        "204":
          description: assignment object deleted succesfully
        "403":
          description: error if entity not found
  /api/monitoring/v1/ticket:
    post:
      tags:
        - monitoring
      summary: Creates a ticket, using the monitoring api
      description: >
        A monitoring system can create tickets. This is mainly the same process
        as creating a ticket via the API (`POST /api/v1/tickets`), but has the
        following special behaviours:


        * You don't have to know the `companyId` or assignment (`linkTypeId` / `linkId`), as the api can retrieve them from the given `groupName`

        * The `groupName` can be assigned to companies or assignment - this is done via the route `/api/monitoring/v1/assignGroup`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/paths/~1api~1v1~1tickets/post/requestBody/content/application~1json/sc\
                    hema"
                - type: object
                  properties:
                    groupName:
                      type: string
                      description: A group name can be entered, to identify the "source" or "device"
                        of the ticket.
                      example: |
                        DC-2008-01 | Festplatte C: voll
      responses:
        "201":
          description: ticket was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/content"
  /api/monitoring/v1/assignGroup:
    post:
      tags:
        - monitoring
      summary: Assigns a groupName to a company or device
      description: >
        Monitoring systems send "groups" to determine, for which device a ticket
        shall be created. A "translation table" can

        be filled with assignments of goup names to specific devices - the following api call does this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object represents a "translation" between a monitoring group
                name and a specific company (or device)
              properties:
                groupName:
                  type: string
                  description: >
                    name of the monitoring group.

                    * You can use wildcards with a "\*" char, i.e. "Server XY -\*" uses all groups starting with "Server XY -"
                  example: Server XY - Festplattensensor
                companyId:
                  type: integer
                  description: id of the company for this monitoring group
                  example: 13323
                linkTypeId:
                  type: integer
                  description: LinkTypeId of the assignment (if known)
                  example: 1
                linkId:
                  type: integer
                  description: LinkId of the assignment (if known)
                  example: 1413
      responses:
        "201":
          description: assignment was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1monitoring~1v1~1assignGroup/post/requestBody/content/appl\
                      ication~1json/schema"
    delete:
      tags:
        - monitoring
      summary: Delete a group assignment
      description: >
        Monitoring systems send "groups" to determine for which device a ticket
        shall be created. A "translation table" can

        be filled with assignments of goup names to specific devices.


        This call deletes such an assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object represents a group id for a group assignment
              properties:
                groupName:
                  type: string
                  description: |
                    name of the monitoring group.
                  example: Server XY - Festplattensensor
      responses:
        "204":
          description: assignment was deleted
        "403":
          description: assignment was not found
    get:
      tags:
        - monitoring
      summary: Gets all group assignments
      description: >
        Monitoring systems send "groups" to determine, for which device a ticket
        shall be created. A "translation table" can

        be filled with assignments of goup names to specific devices.


        This call lists all existing group assignments.
      responses:
        "200":
          description: a list of all group assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1monitoring~1v1~1assignGroup/post/requestBody/content/appl\
                        ication~1json/schema"
  /api/monitoring/v1/ticketsFromGroup:
    get:
      tags:
        - monitoring
      summary: Gets ticket(s), based on a given group
      description: >
        If a monitoring system wants to check if a ticket does exist based on a
        given group name, this can be checked here
      parameters:
        - in: query
          name: groupName
          required: true
          description: Name of the group, which the ticket shall be retrieved for
          schema:
            type: string
        - in: query
          name: closedTickets
          description: The default behaviour ist that only "open" tickets will be
            returned. Set this to "true" if you want to retrieve closed tickets
            as well
          schema:
            type: boolean
      responses:
        "200":
          description: If found, the tickets are returned here (gets a list of tickets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/200/content/app\
                        lication~1json/schema/properties/content"
        "204":
          description: If no ticket was found, an empty body is returned
  "/api/monitoring/v1/ticket/{ticketId}":
    get:
      tags:
        - monitoring
      summary: Gets a ticket (created by the monitoring api) by id
      description: >
        Fetches a ticket by id and returns all aspects of the ticket.

        Only tickets which were created by the monitoring api routes can be fetched.
      parameters:
        - in: path
          name: ticketId
          description: Id of the ticket that should be fetched
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ticket was succesfully retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/200/content/app\
                      lication~1json/schema/properties/content"
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
    put:
      tags:
        - monitoring
      summary: Updates a ticket (created by the monitoring api) by id
      description: >
        Updates a ticket by id.

        Only tickets which were created by the monitoring api routes can be editied.
      parameters:
        - in: path
          name: ticketId
          required: true
          description: Id of the ticket that should be updated
          schema:
            type: integer
      responses:
        "200":
          description: ticket was succesfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/200/content/app\
                      lication~1json/schema/properties/content"
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  /api/erp/v1/invoices:
    post:
      tags:
        - erp
      summary: Insert new invoices
      parameters:
        - in: header
          name: apiToken
          required: true
          schema:
            type: string
          description: ERP Api-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  voucher_id:
                    type: integer
                    example: 102
                    description: Id of the voucher
