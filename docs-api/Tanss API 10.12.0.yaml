                      son/schema/properties/planningTypes/items"
                  description: filter for certain planning types
                planningAdditionalIds:
                  type: array
                  items:
                    type: integer
                  description: filter for certain "additional" planning types (used on absences)
                customTypeIds:
                  type: array
                  items:
                    type: integer
                  description: filter for certain custom types
                statesOnly:
                  type: array
                  items:
                    type: string
                    description: Specifies the status of a vacation request
                    enum:
                      - NEW
                      - REQUESTED
                      - APPROVED
                      - DECLINED
                    example: NEW
                  description: filter for certain planning type states
      responses:
        "200":
          description: a list of vacation requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      type: object
                      description: vacation request (or illness, absence, custom type, overtime,
                        standBy, custom). If a custom type shall be stored, use
                        the planningAdditionalId property to specify the custom
                        type
                      properties:
                        id:
                          type: integer
                          description: id of the vacation request
                        planningType:
                          $ref: "#/paths/~1api~1v1~1supports~1list/put/requestBody/content/application~1j\
                            son/schema/properties/planningTypes/items"
                        status:
                          type: string
                          description: Specifies the status of a vacation request
                          enum:
                            - NEW
                            - REQUESTED
                            - APPROVED
                            - DECLINED
                          example: NEW
                        startDate:
                          type: integer
                          format: timestamp
                          description: start for this vacation request
                        endDate:
                          type: integer
                          format: timestamp
                          description: start for this vacation request
                        requesterId:
                          type: integer
                          description: id of the requester (employee)
                        requestReason:
                          type: string
                          description: reason for this vacation request (optional)
                        requestDate:
                          type: integer
                          format: timestamp
                          description: timestamp when this vacation request was initially created
                        supervisorId:
                          type: integer
                          description: id of the supervisor (employee who has accepted/declined this
                            request)
                        supervisorReason:
                          type: string
                          description: reason for accepting/declining this request (optional)
                        supervisorDate:
                          type: integer
                          format: timestamp
                          description: timestamp when this vacation request was accepted or declined
                        planningAdditionalId:
                          type: integer
                          description: only if planningType is ABSENCE or CUSTOM / used for additional
                            specification (Sonderurlaub, Kur, etc.)
                        processId:
                          type: integer
                          description: if a approval process is used for this vacation request - specifies
                            the id of the process
                        processStepId:
                          type: integer
                          description: if a approval process is used for this vacation request - specifies
                            the id of the current process step
                        days:
                          type: array
                          items:
                            type: object
                            description: describes a day used in a vacation request
                            properties:
                              vacationRequestId:
                                type: integer
                                description: id of the vacation request the day is assigned to
                              date:
                                type: integer
                                format: timestamp
                                description: timestamp for this day. always us the beginning of the day (0:00
                                  o'clock)
                              forenoon:
                                type: boolean
                                description: vacation request for the whole forenoon?
                              afternoon:
                                type: boolean
                                description: vacation request for the whole afternoon?
                              startHour:
                                type: integer
                                description: if only a certain timeframe is used - starting hour
                              startMinute:
                                type: integer
                                description: if only a certain timeframe is used - starting minute
                              endHour:
                                type: integer
                                description: if only a certain timeframe is used - end hour
                              endMinute:
                                type: integer
                                description: if only a certain timeframe is used - end minute
                              pause:
                                type: integer
                                description: if only a certain timeframe is used - pause (in minutes)
