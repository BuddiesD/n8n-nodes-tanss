                        plication~1json/schema/properties/content"
        "404":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  "/api/v1/checklists/{checklistId}/process":
    get:
      tags:
        - checklists
      summary: Gets checklist for ticket
      description: >
        This route will be used for processing a checklist.


        It will fetch the checklist, along with all the values for the current assignment (i.e. ticket).


        If you want to process checklist, this is the main part for fetching all neccessary infos.
      parameters:
        - in: path
          name: checklistId
          required: true
          description: id of the checklist
          schema:
            type: integer
        - in: query
          name: linkTypeId
          required: true
          description: linkTypeId (11 = ticket)
          schema:
            type: integer
        - in: query
          name: linkId
          required: true
          description: id of the ticket
          schema:
            type: integer
      responses:
        "200":
          description: detailled infos for the checklist withing the ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    description: detailled infos for the checklist, with all values (checked items,
                      history, vars atc.)
                    allOf:
                      - description: describes a checklist
                        allOf:
                          - description: describes a checklist
                            type: object
                            properties:
                              id:
                                type: integer
                                description: id of the checklist
                              name:
                                type: string
                                description: name of the checklist
                                example: Windows Installation
                              description:
                                type: string
                                description: describes the checklist, i.e. a short info
                                example: Beschreibt die Installation von Windows
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: id of the checklist
                              name:
                                type: string
                                description: name of the checklist
                                example: Windows Installation
                              description:
                                type: string
                                description: describes the checklist, i.e. a short info
                                example: Beschreibt die Installation von Windows
                              type:
                                type: string
                                description: defines the type of a checklist
                                enum:
                                  - CHECKLIST
                                  - TEMPLATE
                                  - ADHOC
                              creatorId:
                                type: integer
                                description: id of the employee who created this checklist
                              predecessorId:
                                type: integer
                                description: id of the the previous version of the checklist
                              active:
                                type: boolean
                                description: is checklist active?
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              description: represents an item in a checklist
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: id of the item
                                checklistId:
                                  type: integer
                                  description: id of the checklist, which the item is contained in
                                type:
                                  type: string
                                  description: defines the type of a checklist item
                                  enum:
                                    - TEXT_FIELD
                                    - REQUIRED_FIELD
                                    - OPTIONAL_FIELD
                                    - INCLUDED_CHECKLIST
                                    - REQUIRED_TEXT_FIELD
                                    - OPTIONAL_TEXT_FIELD
                                    - REQUIRED_MULTISELECT
                                    - OPTIONAL_MULTISELECT
                                    - EVENT_CONTAINER
                                    - APPROVAL_PROCESS
                                heading:
                                  type: string
                                  description: headinh / title of the checklist item
                                description:
                                  type: string
                                  description: description / text of the checklist item
                                entryPoint:
                                  type: boolean
                                  description: true if this is the first item of a checklist
                                nextItemId:
                                  type: integer
                                  description: id of the "next" field in the process chain
                                serviceText:
                                  type: string
                                  description: text which is used when creating a support
                                hidden:
                                  type: boolean
                                  description: true if thes field is hidden
                                action:
                                  type: object
                                  description: describes the "state" of a checklist item, i.e. if it's checked
                                  properties:
                                    value:
                                      type: integer
                                      description: 1 = checked / 0 = not checked
                                    date:
                                      type: integer
                                      description: date, when the action took place
                                    userId:
                                      type: integer
                                      description: id of the user who checked this field
                                    supportId:
                                      type: integer
                                      description: if a support was created, while this item was check, the id is
                                        given here (which contains the sevice
                                        text for this item)
                                vars:
                                  type: array
                                  description: if vars were used in teh text, these must be given in the "check"
                                    body to fill in the correct values / infos
                                    for checking the item
                                  items:
                                    type: object
                                    description: This object represents a type of a checklist variable
                                    properties:
                                      name:
                                        type: string
                                        description: name of the variable
                                        example: Variablen-Name
                                      type:
                                        description: defines the type of a checklist variable
                                        type: string
                                        enum:
                                          - INPUT
                                          - MULTISELECT
                                          - PASSWORD
                                          - OUTPUT
                                          - ERP_SELECTION
                                        example: MULTISELECT
                                      options:
                                        description: this fields is only set on MULTISELECT varaibles and contains all
                                          selectable options
                                        type: array
                                        items:
                                          type: string
                                        example:
                                          - Option 1
                                          - Option 2
        "404":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  /api/v1/checklists/check:
    put:
      tags:
        - checklists
      summary: Check an item
      description: |
        This route will check (or uncheck) an item in a checklist
      requestBody:
        description: infos regarding the item to be checked
        required: true
        content:
          application/json:
            schema:
              type: object
              description: infos required for checking an item in a checklist
              properties:
                itemId:
                  type: integer
                  description: id of the checlist item that will be checked
                checklistId:
                  type: integer
                  description: id of the checklist which this item is in
                mainChecklistId:
                  type: integer
                  description: if the item is part of an "included" checklist, you must specify
                    the "main" checklist as well
                linkTypeId:
                  type: integer
                  description: linktype of the assignment (i.e. 11 for ticket)
                linkId:
                  type: integer
                  description: link id of the assignment (if assigned to a ticket then the ticket
                    id goes here)
                value:
                  type: integer
                  description: 1 = check / 0 = uncheck
                multiSelectId:
                  type: integer
                  description: if an multiselect option is checked, give the multiselect option id
                    here
                vars:
                  type: object
                  description: if vars are needed for checking this field, then give these here
                  additionalProperties:
                    type: string
                  example:
                    var1: Eingegebener Text
                    var2: Noch ein Text für eine Variable
      responses:
        "200":
          description: item checked
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1checklists~1%7BchecklistId%7D~1process/get/responses/\
                      200/content/application~1json/schema/properties/content"
        "404":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  /api/v1/supports/list:
    put:
      tags:
        - supports
      summary: Get a support list
      requestBody:
        description: query parameters for retrieving supports
        required: true
        content:
          application/json:
            schema:
              description: >
                object containing support list query parameters.


                When querying support with these parameters, you can only use the filter settings you need (You don't have to specify all)
              type: object
              properties:
                timeframe:
                  $ref: "#/paths/~1api~1calls~1v1/put/requestBody/content/application~1json/schem\
                    a/properties/timeframe"
                supportLocations:
                  description: show only supports from these support locations
                  type: array
                  items:
                    type: string
                    description: Defines, where a support takes place
                    enum:
                      - OFFICE
                      - CUSTOMER
                      - REMOTE
                supportIconTypes:
                  description: show only supports with these support icon types
                  type: array
                  items:
                    type: string
                    description: determines the icon used to display this support
                    enum:
                      - STANDARD
                      - REMOTE
                      - NOT_CHARGED
                      - ERP
                      - INSTALLATION_FEE
                      - FULLSERVICE
                      - CONTRACT
                      - PREPAID
                companies:
                  type: array
                  items:
                    type: integer
                  description: show only supports from this companies (ids)
                employees:
                  type: array
                  items:
                    type: integer
                  description: filter for emmployees (technician) ids
                internalSupport:
                  type: string
                  description: determines which filter for "internal support" shall be used
                  enum:
                    - ALL
                    - ONLY_INTERNAL
                    - ONLY_EXTERNAL
                companyCategories:
                  type: array
                  items:
                    type: integer
                  description: show supports from these company categories (ids)
                companyCategoriesMatchType:
                  type: string
                  description: Enum representing the logic linking of certain ids (AND / NOT / OR)
                  enum:
                    - AND
                    - OR
                    - NOT
                excludeOwnCompany:
                  type: boolean
                  description: true, if supports from the own company shall be excluded
                invoiceNumber:
                  type: string
                  description: filter for a certain invoice (erp) number
                excludeExternalEmployees:
                  type: boolean
                  description: true if external employees shall be excluded
                discountedSupports:
                  type: string
                  description: determines which filter for "discounted" supports shall be used
                  enum:
                    - ALL
                    - ONLY_WITH_ADDITION
                    - ONLY_WITH_DISCOUNT
                    - ONLY_WITH_ZERO_PERCENT
                notChargedReasons:
                  type: array
                  items:
                    type: integer
                  description: show supports from these "Not charged reasons" only
                departmentFilter:
                  type: array
                  items:
                    type: integer
                  description: show supports from these departments only
                ticketTypes:
                  type: array
                  items:
                    type: integer
                  description: show supports from these ticket types
                tickets:
                  type: array
                  items:
                    type: integer
                  description: show supports from these ticket (ids) only
                ticketPhases:
                  type: array
                  items:
                    type: integer
                  description: show supports from these ticket phases only
                linkTypes:
                  type: array
                  items:
                    type: integer
                  description: show supports from these link types only
                supportTypes:
                  type: array
                  items:
                    type: integer
                  description: show supports from these support types only
                includeSubTickets:
                  type: boolean
                  description: if true, all sub-ticket supports will be included as well (when
                    displaying support from projects)
                planningTypes:
                  type: array
                  items:
                    type: string
                    description: The planning type defines if a support is actually a support,
                      appointment (or some other type)
                    enum:
                      - SUPPORT
                      - APPOINTMENT_PROPOSAL
                      - APPOINTMENT_FIX
                      - VACATION
                      - ILLNESS
                      - ABSENCE
                      - STAND_BY
                      - APPOINTMENT_PRIVATE
                      - OVERTIME
                      - CUSTOM
                  description: show supports from these planning types only
                textFilter:
                  type: string
                  description: if filtering for support containing a given text, you can specify
                    the text filter here
                useRelations:
                  type: boolean
                  description: true if relation supports shall fe fecthed as well (when specifying
                    company filter)
                openTickets:
                  type: string
                  description: determines wether supports from open tickets shall be fecthed or
                    not
                  enum:
                    - SUPPORTS_FROM_ALL_TICKETS
                    - SUPPORTS_FROM_OPEN_TICKETS
                    - SUPPORTS_FROM_CLOSED_TICKETS
                    - ALL_SUPPORTS_BUT_OPEN_TICKETS
                taskFilter:
                  type: string
                  description: determines wether supports from tasks shall be fetched as well
                  enum:
                    - ONLY_TASK_SUPPORTS
                    - NO_TASK_SUPPORTS
                importTypes:
                  type: array
                  items:
                    $ref: "#/paths/~1api~1v1~1supports~1list/put/requestBody/content/application~1j\
                      son/schema/properties/planningTypes/items"
                  description: show supports from these support "import types" only
                contracts:
                  type: array
                  items:
                    type: integer
                  description: show supports from these contracts (ids)
                fetchRecurring:
                  type: boolean
                  description: true if recurrence rules (appointments) shall be fetched as well
      responses:
        "200":
          description: a list of support entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: describes a support entry (same for appointment)
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              description: id of this support
                            ticketId:
                              type: integer
                              description: id of the connected ticket
                            date:
                              type: integer
                              format: timestamp
                              description: beginning of the support
                            remitterId:
                              type: integer
                              description: id of the remitter (employee)
                            duration:
                              type: integer
                              description: duration of the service (in minutes)
                            location:
                              type: string
                              description: Defines, where a support takes place
                              enum:
                                - OFFICE
                                - CUSTOMER
                                - REMOTE
                            linkTypeId:
                              type: integer
                              description: link type of the assignment
                            linkId:
                              type: integer
                              description: id of the assignment
                            typeId:
                              type: integer
                              description: id of the support type
                            text:
                              type: string
                              description: description / text for this support entry
                            durationNotCharged:
                              type: integer
                              description: duration which is not charged (in minutes)
                            employeeId:
                              type: integer
                              description: id of the employee who has done this support
                            planningType:
                              $ref: "#/paths/~1api~1v1~1supports~1list/put/requestBody/content/application~1j\
                                son/schema/properties/planningTypes/items"
                            costCenterId:
                              type: integer
                              description: id of the cost center
                            reasonNotChargedText:
                              type: string
                              description: if support was not chatged, the reason / text goes here
                            reasonNotChargedId:
                              type: integersupport-model
                              description: id of the "not charged reason" (if support was completely not
                                charged)
                            reasonPartialNotChargedId:
                              type: integer
                              description: id of the "not charged reason" (if support was partially not
                                charged)
                        - type: object
                          properties:
                            orderedViaId:
                              type: integer
                              description: id of the method, the remitter hat given the order (optional)
                            percent:
                              type: number
                              description: percent that shall be applied
                            softwareLicenseId:
                              type: integer
                              description: if a pc is used as an assignment, a license can be given as well
                                (optional)
                            accountingTypeId:
                              type: integer
                              description: id of the accountingtype used for this support (i.e. "Techniker")
                            booked:
                              type: boolean
                              description: wether the support was already booked
                            clearanceStatus:
                              type: string
                              description: determines if a support was already "cleared" for billing
                              enum:
                                - NONE
                                - CLEARED
                            companyId:
                              type: integer
                              description: id of the company for this support
                            contractId:
                              type: integer
                              description: id of the contract, used for this support
                            taskId:
                              type: integer
                              description: if support is assigned to a task, use it here
                            createdEmployeeId:
                              type: integer
                              description: id of the employee who has created this support
                            departmentId:
                              type: integer
                              description: if used, id of the department which is assigned to this support
                            durationApproach:
                              type: integer
                              description: duration (in minutes) of the approach (drive)
                            driveType:
                              type: string
                              description: defines which drive type is used
                              enum:
                                - KM
                                - ZONE
                            driveCharged:
                              type: boolean
                              description: determines if the drive shall be charged or not
                            durationApproachCharged:
                              type: boolean
                              description: false if the duration approach is not charged (should be true by
                                default)
                            kmApproach:
                              type: integer
                              description: km of the approach (drive)
                            kmApproachCharged:
                              type: boolean
                              description: false if the km approach is not charged (should be true by default)
                            durationDeparture:
                              type: integer
                              description: duration (in minutes) of the departure (drive)
                            durationDepartureCharged:
                              type: boolean
                              description: false if the duration departure is not charged (should be true by
                                default)
                            kmDeparture:
                              type: integer
                              description: km of the departure (drive)
                            kmDepartureCharged:
                              type: boolean
                              description: false if the km departure is not charged (should be true by
                                default)
                            zoneId:
                              type: integer
                              description: id of the zone (if zone is used)
                            carId:
                              type: integer
                              description: id of the car (if car is used)
                            startBreak:
                              type: integer
                              format: tiemstamp
                              description: timestamp when the pause starts (0 if no pause is given)
                            durationBreak:
                              type: integer
                              description: duration of the pause (in minutes)
                            erpNumber:
                              type: string
                              description: if the support has an erp number entered
                            extern:
                              type: boolean
                              description: if this support was created by a customer login, this value is
                                "true"
                            externalTicketId:
                              type: string
                              description: if the support has an external ticket number entered, this number
                                is given here
                            hourlyRate:
                              type: number
                              format: double
                              description: the hourly rate for this support (or the rate per working unit)
                            installationFee:
                              type: boolean
                              description: wether the support will be billed as an "installation fee" with a
                                fixed price
                            installationFeeAmount:
                              type: number
                              format: double
                              description: if the support will be billed as an "installation fee", the amount
                                is given here
                            installationFeeTypeId:
                              type: integer
                              description: if the support will be billed as an "installation fee", the id of
                                the installation fee type is given here
                            installationFeeDriveMode:
                              type: string
                              description: defines if the drive shall be included in the instalaltion fee
                              enum:
                                - DRIVE_INCLUDED
                                - DRIVE_EXCLUDED
                            internal:
                              type: boolean
                              description: if this support is marked as "internal" (customers won't see those)
                            outlook:
                              type: boolean
                              description: true, if this support is a TANSS2Ex appointment
                            outlookTitle:
                              type: string
                              description: title for outlook appointments
                            outlookLocation:
                              type: string
                              description: location for outlook appointments
                            teamsUrl:
                              type: string
                              description: if the synced appointment has a teams url, you can specify it here
                            supportIconType:
                              type: string
                              description: determines the icon used to display this support
                              enum:
                                - STANDARD
                                - REMOTE
                                - NOT_CHARGED
                                - ERP
                                - INSTALLATION_FEE
                                - FULLSERVICE
                                - CONTRACT
                                - PREPAID
                            textIntern:
                              type: string
                              description: internal remarks for this support (customers won't see this)
                            voucherId:
                              type: integer
                              description: if the support was already booked and assigned to a voucher, the
                                voucher id is given here
                            importType:
                              $ref: "#/paths/~1api~1v1~1supports~1list/put/requestBody/content/application~1j\
                                son/schema/properties/planningTypes/items"
                            separateBilling:
                              type: boolean
                              description: true, if this support shall be billed separately
                            relationshipLinkTypeId:
                              type: integer
                              description: if a relationship shall be used, give here the link type of the
                                relationship
                            relationshipLinkId:
                              type: integer
                              description: if a relationship shall be used, give here the link id of the
                                relationship
                            serviceLocationId:
                              type: integer
                              description: if a service location is used, give here the company of the service
                                location
                              example: null
