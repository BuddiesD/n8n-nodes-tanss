        description: query parameters for retrieving documents
        required: true
        content:
          application/json:
            schema:
              type: object
              description: filter object for fetching a document list
              properties:
                companyId:
                  type: integer
                  description: if given, will only show documents of this company
                linkTypeId:
                  type: integer
                  description: show only documents for this assignment (linkTypeId)
