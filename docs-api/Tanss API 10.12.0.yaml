                  properties:
                    status:
                      type: string
                      example: OK
                    voucher_id:
                      type: integer
                      example: 102
                    order_request:
                      type: string
                      example: <?xml ... ?> // Order-Request-XML - Base64 encoded
                    pdf:
                      type: string
                      example: "%PDF-1.3... // PDF - Base64 encoded"
