  "/api/v1/timers/notes/{timerId}":
    get:
      tags:
        - timers
      summary: Get all timer fragments
      description: This route will get all timer fragments of a given timer (start- /
        stop-dates)
      parameters:
        - in: path
          name: timerId
          description: id of the timer
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: timer fragments
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: >
                        Timers can have multiple fragments, meaning a start/stop
                        timeframe.

                        Each fragment can have a note.

                        A timer is running if the last fragment has no stop time.

                        If the last fragment has a stop time, the timer is stopped.
                      type: object
                      properties:
                        timerId:
                          type: integer
                          description: id of the timer id for this fragment
                        startTime:
                          type: integer
                          format: timestamp
                          description: starting time of the fragment
                        stopTime:
                          type: integer
                          format: timestamp
                          description: end time of the fragment (if 0 means that the timer is still
                            running)
                        note:
                          type: string
                          description: >
                            a note for this fragment.

                            You could for example make notes of things which are done in this fragment which should help generating the support for this timer
