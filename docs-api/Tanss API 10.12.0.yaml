  /api/v1/chats:
    post:
      tags:
        - chats
      summary: Creates a new chat
      description: >
        Creates a new chat in TANSS. The chat must contain at least one
        participant and one message
      requestBody:
        description: chat object to be saved
        required: true
        content:
          application/json:
            schema:
              description: TANSS chat (including info regarding messages, participants, logs)
              allOf:
                - type: object
                  description: TANSS chat
                  properties:
                    id:
                      type: integer
                    description:
                      type: string
                      description: if a general chat (without assignment) is created, a description is
                        needed
                    linkTypeId:
                      type: integer
                      description: linkType of assignment
                    linkId:
                      type: integer
                      description: id of assignment
                    status:
                      type: string
                      description: Enum representing a the state of the chat
                      enum:
                        - OPEN
                        - CLOSED
                    closedByEmployeeId:
                      type: integer
                      description: id of employee who has closed this chat
                    expectedResponseTime:
                      type: integer
                      format: timestamp
                      description: timestamp of an expected response (if chat has an expected
                        response)
                    createdByEmployeeId:
                      type: integer
                      description: id of employee who has created this chat
                    creationDate:
                      type: integer
                      format: timestamp
                      description: timestamp of an chat creation
                - type: object
                  properties:
                    messages:
                      type: array
                      items:
                        description: chat message object
                        allOf:
                          - description: chat message object (for persisting)
                            type: object
                            properties:
                              chatId:
                                type: integer
                                description: id of the corresponding chat id
                              content:
                                type: string
                                description: actual content / message
                              expectedResponse:
                                type: integer
                                description: (optional) number of minutes in which a response is expected
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: id of the chat message
                              employeeId:
                                type: integer
                                description: id of the employee who has sent this message
                              creationDate:
                                type: integer
                                format: timestamp
                                description: date when the message was sent
                              expectedResponse:
                                type: integer
                                description: if the message has an expected response time, this is given here
                                  (in minutes)
                    participants:
                      type: array
                      items:
                        type: object
                        properties:
                          chatId:
                            type: integer
                            description: id of the corresponding chat id
                          employeeId:
                            type: integer
                            description: if the participant is an employee, the id is given here
                          departmentId:
                            type: integer
                            description: if the participant is an department, the id is given here
                    logs:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: id of the chat log
                          chatId:
                            type: integer
                            description: id of the corresponding chat id
                          employeeId:
                            type: integer
                            description: id of the user who has done this action
                          date:
                            type: integer
                            format: timestamp
                            description: date and time of this log entry
                          type:
                            type: string
                            description: Enum representing a chat log type
                            enum:
                              - CLOSED
                              - REOPENED
                              - ADDED_EMPLOYEE
                              - ADDED_DEPARTMENT
                              - REMOVED_EMPLOYEE
                              - REMOVED_DEPARTMENT
                              - REQUESTED_CLOSING
                              - DECLINED_CLOSING
                          info:
                            type: string
                            description: >
                              info to this log entry. For example if the type
                              was "ADDED_EMPLOYEE", then the employee id is
                              stored here
      responses:
        "201":
          description: chat was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1chats/post/requestBody/content/application~1json/sche\
                      ma"
    put:
      tags:
        - chats
      summary: Get a list of chats
      description: |
        Retrieves a list of chats from the database, using misc. filter settings
      requestBody:
        description: filter settings
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Here, the filter settings for the chat list are stored
              properties:
                employeeId:
                  type: integer
                  description: filters chats for a given employee id. All chats will be returned
                    to which this employee has access to
                onlyExpectedTimeExpired:
                  type: boolean
                  description: if true, only open chats with an expired expected time will be
                    shown (overrides "status")
                chatIds:
                  type: array
                  items:
                    type: integer
                  description: if a list of specific chat ids shall be used, you can place the
                    here
                status:
                  type: string
                  description: Enum representing a the state of the chat
                  enum:
                    - OPEN
                    - CLOSED
                searchString:
                  type: string
                  description: If chats shall be filtered for a given search text, this text goes
                    here
                linkTypeId:
                  type: integer
                  description: linkType of assignment
                linkId:
                  type: integer
                  description: id of assignment
                linkIds:
                  type: array
                  items:
                    type: integer
                  description: if multiple assignment ids schall be fetched, you can use an array
                    of integers here
                creatorId:
                  type: integer
                  description: filters chats from this given chat creator
                showOnlyParticapatedChat:
                  type: boolean
                  description: >
                    if true, only returns chats which the employee is assigned
                    as creator or participant.

                    Otherwise returns all chats whith access.
                loadMessages:
                  type: string
                  description: describes if/which messages shall be loaded in a chat list
                  enum:
                    - NONE
                    - ALL
                    - LAST
                fillLinkedEntities:
                  type: boolean
                  description: if true, the "linked entities" will be filled as well (with
                    information regarding employees, tickets etc.)
                minimumCreationDate:
                  type: integer
                  format: timestamp
                  description: only returns chats with at least the given creation date
                itemsPerPage:
                  type: integer
                  description: if pagination is used, you can enter the number of items per page
                page:
                  type: integer
                  description: if pagination is used, you can enter the page number here
      responses:
        "200":
          description: list of all retrived chats
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1chats/post/requestBody/content/application~1json/sche\
                        ma"
