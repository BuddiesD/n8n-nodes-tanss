  /api/v1/callbacks:
    post:
      tags:
        - callback
      summary: Creates a callback
      description: |
        Creates a new callback in TANSS
      requestBody:
        description: callback object to be saved
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Defines a callback
              properties:
                fromEmployeeId:
                  type: integer
                  description: Defines the employee who entered the callback
                  example: 2
                toEmployeeId:
                  type: integer
                  description: The callback is assigned to this employee (This person has to do
                    the call)
                  example: 1234
                toDepartmentId:
                  type: integer
                  description: Callbacks can be assigned to a special department. Every employee
                    of this department sees the callback.
                date:
                  type: integer
                  format: timestamp
                  description: The callback was created on this date
                  example: 1576234800
                companyId:
                  type: integer
                  description: Here, the id of the company is given which has to be called back
                  example: 100000
                companyName:
                  type: string
                  description: same as "companyId", but here a string can be given (i.e. if the
                    company wasn't created yet in TANSS)
                  example: HUCK IT GmbH
                employeeId:
                  type: integer
                  description: Here, the id of the employee is given (who has to be called back)
                employeeName:
                  type: string
                  description: same as "employeeId", but here a string can be given (i.e. if the
                    employee wasn't created yet in TANSS)
                  example: Hans Mustermann
                phoneNumber:
                  type: string
                  description: You must define the phone number here
                  example: 06154/6006-0
                info:
                  type: string
                  description: (Optional) Further information regarding the callback
                  example: Kunde wünscht dringen Rückruf auf dem Handy!
                state:
                  description: Describes a current "state" of a callback
                  type: string
                  enum:
                    - UNSEEN
                    - NEW
                    - NOBODY_ANSWERED
                    - BUSY
                    - NOT_PRESENT
                    - NEW_CALLBACK_REENTERED
                    - COMPLETED
                    - EXPECTED_CALLBACK
                    - EXPECTED_CALLBACK_COMPLETED
                priority:
                  type: integer
                  description: priority of the callback from 1 (lowest) to 9 (highest)
                callbackAfterTime:
                  type: integer
                  format: timestamp
                  description: If the callback has to be "later" than a specific time, give here
                    the minimum date for the callback
                callbackUntilTime:
                  type: integer
                  format: timestamp
                  description: If the callback has to be processed before a given date, specify
                    this "latest" date here
                linkTypeId:
                  type: integer
                  description: If the callback is assigned to a ticket (or other assignment),
                    linkType is given here
                  example: 11
                linkId:
                  type: integer
                  description: If the callback is assigned to a ticket (or other assignment), the
                    id is given here
                  example: 12345
      responses:
        "201":
          description: callback was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1callbacks/post/requestBody/content/application~1json/\
                      schema"
    put:
      tags:
        - callback
      summary: Get a list of callbacks
      description: >
        Retrieves a list of callback from the database, using misc. filter
        settings
      requestBody:
        description: filter settings
        required: true
        content:
          application/json:
            schema:
              type: object
              description: filter settings for retrieving callbacks
              properties:
                timeframe:
                  $ref: "#/paths/~1api~1calls~1v1/put/requestBody/content/application~1json/schem\
                    a/properties/timeframe"
                state:
                  description: Describes a current "state" of a callback
                  type: string
                  enum:
                    - UNSEEN
                    - NEW
                    - NOBODY_ANSWERED
                    - BUSY
                    - NOT_PRESENT
                    - NEW_CALLBACK_REENTERED
                    - COMPLETED
                    - EXPECTED_CALLBACK
                    - EXPECTED_CALLBACK_COMPLETED
                states:
                  type: array
                  description: if multiple states have to be filtered, give an array here
                  items:
                    $ref: "#/paths/~1api~1v1~1callbacks/put/requestBody/content/application~1json/s\
                      chema/properties/state"
                fromEmployeeId:
                  type: integer
                  description: filters only callbacks which were created by this employee
                    (technician)
                toEmployeeId:
                  type: integer
                  description: filters only callbacks to this employee (techncian)
                toAllEmployeesWithAccessTo:
                  type: boolean
                  description: if "toEmployeeId" is given, also retrieves all callbacks which the
                    user has access to
                toDepartmentIds:
                  type: integer
                  description: filters only callbacks for these departments
                companyIds:
                  type: integer
                  description: filters only callbacks for these (customer) companies (ids given
                    here)
                employeeIds:
                  type: integer
                  description: filters only callbacks for these (customer) employees (ids given
                    here)
                loadLinkedEntites:
                  type: boolean
                  description: if true, "linked entities" will be loaded as well (given in the
                    responses "meta" section)
                withLog:
                  type: boolean
                  description: if true, will also load all state logs of the retrieved callbacks
                itemsPerPage:
                  type: integer
                  description: if pagination shall be used, give here the items per page
                page:
                  type: integer
                  description: if pagination shall be used, the page number is given here
      responses:
        "200":
          description: list of all retrived callbacks
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: ticket model with all fields
                      allOf:
                        - type: object
                          description: Defines a callback
                          properties:
                            fromEmployeeId:
                              type: integer
                              description: Defines the employee who entered the callback
                              example: 2
                            toEmployeeId:
                              type: integer
                              description: The callback is assigned to this employee (This person has to do
                                the call)
                              example: 1234
                            toDepartmentId:
                              type: integer
                              description: Callbacks can be assigned to a special department. Every employee
                                of this department sees the callback.
                            date:
                              type: integer
                              format: timestamp
                              description: The callback was created on this date
                              example: 1576234800
                            companyId:
                              type: integer
                              description: Here, the id of the company is given which has to be called back
                              example: 100000
                            companyName:
                              type: string
                              description: same as "companyId", but here a string can be given (i.e. if the
                                company wasn't created yet in TANSS)
                              example: HUCK IT GmbH
                            employeeId:
                              type: integer
                              description: Here, the id of the employee is given (who has to be called back)
                            employeeName:
                              type: string
                              description: same as "employeeId", but here a string can be given (i.e. if the
                                employee wasn't created yet in TANSS)
                              example: Hans Mustermann
                            phoneNumber:
                              type: string
                              description: You must define the phone number here
                              example: 06154/6006-0
                            info:
                              type: string
                              description: (Optional) Further information regarding the callback
                              example: Kunde wünscht dringen Rückruf auf dem Handy!
                            state:
                              description: Describes a current "state" of a callback
                              type: string
                              enum:
                                - UNSEEN
                                - NEW
                                - NOBODY_ANSWERED
                                - BUSY
                                - NOT_PRESENT
                                - NEW_CALLBACK_REENTERED
                                - COMPLETED
                                - EXPECTED_CALLBACK
                                - EXPECTED_CALLBACK_COMPLETED
                            priority:
                              type: integer
                              description: priority of the callback from 1 (lowest) to 9 (highest)
                            callbackAfterTime:
                              type: integer
                              format: timestamp
                              description: If the callback has to be "later" than a specific time, give here
                                the minimum date for the callback
                            callbackUntilTime:
                              type: integer
                              format: timestamp
                              description: If the callback has to be processed before a given date, specify
