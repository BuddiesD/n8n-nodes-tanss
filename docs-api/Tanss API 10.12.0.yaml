                        documentedSupport:
                          type: integer
                          description: Number of total minutes of all documented supportd
                        workingTime:
                          type: integer
                          description: The number of minutes, the employee has to work on this day (based
                            on his working time model)
                        workingTimeCleaned:
                          type: integer
                          description: Subtracts the "workingTime" with the minutes of "paid absences",
                            thus returning the "effective" working time the
                            employee has to work
                        totalTime:
                          type: integer
                          description: Cumulating the "totalTimestampWorkTime", "paidAbsences" and
                            "unpaidAbsences"
                        documentedPercentage:
                          type: integer
                          description: a ration between the documented supports to the "WORK" timestamps
                        balance:
                          type: integer
                          description: returns the effective balance for this account (= totalTime -
                            workingTimeCleaned)
                        completedByEmployeeId:
                          type: integer
                          description: the id of the employee who has approved the day
                        completedOnDate:
                          type: integer
                          format: timestamp
                          description: the timestamp, when the employee has approved the day closing
                        totalBalance:
                          type: integer
                          description: the total balance of all previous days accumulated, plus the
                            balance of the current day
                        totalBalanceBeforeTimeframe:
                          type: integer
                          description: the total balance of all previous -not shown- days accumulated
        "403":
          description: an error occurs if the day closing objects already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      text:
                        type: string
                        description: error message goes here
    delete:
      tags:
