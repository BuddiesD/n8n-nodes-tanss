                              software:
                                type: string
                                description: a text field which contains infos about installed software
                                example: Div. Software wurde installiert, ...
                              remark:
                                type: string
                                description: a text field which contains misc. infos / remarks about this pc
                                example: "Folgendes ist beim Server zu beachten: ..."
                              showRemark:
                                type: boolean
                                description: if true, the remark will be shown as popup when this pc is selected
                                  in a support/ticket mask and the employee has
                                  the permission
