    put:
      tags:
        - ticket lists
      summary: Get a (custom) ticket list
      requestBody:
        description: query parameters for retrieving ticket
        required: true
        content:
          application/json:
            schema:
              type: object
              description: query paremeters for fetching a custom ticket list
              properties:
                staff:
                  type: array
                  items:
                    type: integer
                  description: fetch only tickets assigned to these employees
                notAssignedToEmployees:
                  type: array
                  items:
                    type: integer
                  description: don't fetch tickets assigned to these employees
                companies:
                  type: array
                  items:
                    type: integer
                  description: fetch only ticket from these companies
                departments:
                  type: array
                  items:
                    type: integer
                  description: fetch only ticket assigned to these departments
                isRepair:
                  type: boolean
                  description: if set, will only fetch repair (or no repair) tickets
                remitterId:
                  type: integer
                  description: if set, will only fetch tickets of this remitter id
                ids:
                  type: array
                  items:
                    type: integer
                  description: fetch only ticket with these ids
                projectId:
                  type: integer
                  description: fetches only tickets of this project
                phaseId:
                  type: integer
                  description: fetches only tickets of a given phase id
                includeDoneTickets:
                  type: boolean
                  description: by deafult, only "open" tickets will be fetched. if "done" tickets
                    shall be fetched as well, this has to be given here
                types:
                  type: array
                  items:
                    type: integer
                  description: fetch only ticket with these type ids
                states:
                  type: array
                  items:
                    type: integer
                  description: fetch only ticket with these state ids
                itemsPerPage:
                  type: integer
                  description: Number of tickets that shall be fetched (pagination)
                page:
                  type: integer
                  description: Page number (pagination)
                modifiedWithinTimeframe:
                  type: object
                  description: fetch only ticket which were modified in given timeframe
                  properties:
                    from:
                      type: integer
                      format: timestamp
                      description: Unix timestamp of the "from" date
                      example: 1568239200
                    to:
                      type: integer
                      format: timestamp
                      description: Unix timestamp of the "to" date
                      example: 1568325599
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
