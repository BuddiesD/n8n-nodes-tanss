                $ref: "#/paths/~1api~1v1~1timestamps~1dayClosing/post/requestBody/content/appli\
                  cation~1json/schema/items"
      responses:
        "204":
          description: a list of deleted timestamps
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1timestamps~1dayClosing/post/responses/201/content/app\
                        lication~1json/schema/properties/content/items"
  /api/v1/timestamps/dayClosing/tillDate:
    get:
      tags:
        - timestamp
      summary: gets all infos about last dayclosings for employees
      description: >
        This route gets a list of all employees which you have (statistic)
        access to and return the last dayClosing

        for this employee.


        If the employee doesn't have a dayClosing yet, the date is 0.


        Name of the employees are give in the linked entities.
      responses:
        "200":
          description: a list of day closjng objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1timestamps~1dayClosing/post/responses/201/content/app\
                        lication~1json/schema/properties/content/items"
    post:
      tags:
        - timestamp
      summary: created dayClosings to a given date
      description: >
        This route will create all "missing" dayClosings for a given list of
        employees till a given date.


        The list of created dayClosing objects will be returned.
      requestBody:
        description: Parameters defining the request (date end list of employees)
        required: true
        content:
          application/json:
            schema:
              description: >
                parameters that define, for which employees to which date the
                day closings shall be created
              type: object
              properties:
                tillDate:
                  type: string
                  description: date in the format YYYY-MM-DD
                  example: 2020-06-17
                employeeIds:
                  type: array
                  items:
                    type: integer
                  example:
                    - 2
                    - 3
                    - 103
      responses:
        "201":
          description: a list of created dayClosing objects and errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    description: >
                      response given when creating day closings till a given date
                    type: object
                    properties:
                      createdDayClosings:
                        description: a list of created day closing objects
                        type: array
                        items:
                          description: >
                            Describes a day closing of a timestamp statistic.
                            Here, all values are persisted into the database
                            with infos

                            about working time, vacation, documented supports and the balance for this day.
                          type: object
                          properties:
                            employeeId:
                              type: integer
                              description: id of the employee for this day closing
                            date:
                              type: string
                              format: date
                              description: day for this day closing (YYYY-mm-dd)
                            totalTimestampWorkTime:
                              type: integer
                              description: Number of total minutes of all WORK timstamp periods for this day
                            paidAbsences:
                              type: integer
                              description: Number of total minutes of paid absences (= vacation, illness,
                                overtime and paid absences)
                            unpaidAbsences:
                              type: integer
                              description: Number of total minutes of unpaid absences (= unpaid absences)
                            documentedSupport:
                              type: integer
                              description: Number of total minutes of all documented supportd
                            workingTime:
                              type: integer
                              description: The number of minutes, the employee has to work on this day (based
                                on his working time model)
                            workingTimeCleaned:
                              type: integer
                              description: Subtracts the "workingTime" with the minutes of "paid absences",
                                thus returning the "effective" working time the
                                employee has to work
                            totalTime:
                              type: integer
                              description: Cumulating the "totalTimestampWorkTime", "paidAbsences" and
                                "unpaidAbsences"
                            documentedPercentage:
                              type: integer
                              description: a ration between the documented supports to the "WORK" timestamps
                            balance:
                              type: integer
                              description: returns the effective balance for this account (= totalTime -
                                workingTimeCleaned)
                            completedByEmployeeId:
                              type: integer
                              description: the id of the employee who has approved the day
                            completedOnDate:
                              type: integer
                              format: timestamp
                              description: the timestamp, when the employee has approved the day closing
                            totalBalance:
                              type: integer
                              description: the total balance of all previous days accumulated, plus the
                                balance of the current day
                            totalBalanceBeforeTimeframe:
                              type: integer
                              description: the total balance of all previous -not shown- days accumulated
                      errors:
                        description: a list of errors that occured while creating the day closings
                        type: array
                        items:
                          description: >
                            details on an error that occured while creating
                            multiple day closings
                          type: object
                          properties:
                            employeeId:
                              type: integer
                              description: id of the employee
                            date:
                              type: string
                              format: date
                              description: day when the error occured
                            text:
                              description: key/identifier of the error message
                              type: string
                            localizedText:
                              description: localized text of the error message
                              type: string
  "/api/v1/timestamps/employee/{employeeId}/initialBalance":
    post:
      tags:
        - timestamp
      summary: sets the initial balance for this employee
      description: >
        When transferring balances from a foreign system, the balance could have
        an initial

        value. This can be set by using this call.


        Requires the permission to change other employees timestamps directly
      parameters:
