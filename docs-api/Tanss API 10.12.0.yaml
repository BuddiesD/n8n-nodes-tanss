  /api/v1/tanssEvents:
    put:
      tags:
        - activityFeed
      summary: List of user items
      description: |
        This route will gibe a list of activity feed items for the user
      requestBody:
        description: list filter object
        required: true
        content:
          application/json:
            schema:
              type: object
              description: defines the filter for the activity feed items
              properties:
                minimumCreationDate:
                  type: integer
                  format: timestamp
                  description: if given, will only fetch newer activity feed items
                linkTypes:
                  type: array
                  items:
                    $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                      on~1json/schema/properties/assignments/items/properties/l\
                      inkType"
                linkIds:
                  type: array
                  description: link ids that shall be filtered for
                  items:
                    type: integer
                triggerTypes:
                  type: array
                  items:
                    type: string
                    description: describes the "trigger type" of an event
                    enum:
                      - TICKET_STATUS_CHANGED
                      - TICKET_ASSIGNED_TO_ANOTHER_TECHNICIAN
                      - TICKET_NEW_COMMENT
                      - TICKET_NEW_SUPPORT
                      - TICKET_CREATED
                      - TICKET_REMINDER
                      - TICKET_EMAIL_RECEIVED
                      - TICKET_NOT_MORE_ASSIGNED_TO_SELF
                      - TICKET_NEW_SERVICE_CAP
                      - TICKET_CLOSED
                      - TICKET_NEW_DUE_DATE
                      - TICKET_NEW_DEADLINE
                      - TICKET_RESUBMISSION_HIT
                      - TICKET_TAGS_CHANGED
                preventViewEvent:
                  type: boolean
                  description: if true, will nor mark item as "seen"
                includeContent:
                  type: boolean
                  description: if true, additional content will be given(i.e. ticket object)
                seenFilter:
                  type: string
                  description: filter for the field "seen"
                  enum:
                    - BOTH
                    - ONLY_SEEN
                    - ONLY_UNSEEN
                confirmedFilter:
                  type: string
                  description: filter for the field "confirmed"
                  enum:
                    - BOTH
                    - ONLY_CONFIRMED
                    - ONLY_UNCONFIRMED
      responses:
        "200":
          description: list of activity feed items
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1tanssEvents~1rules~1test~1action/put/responses/201/co\
                        ntent/application~1json/schema/properties/content"
  /api/v1/tanssEvents/unseen:
