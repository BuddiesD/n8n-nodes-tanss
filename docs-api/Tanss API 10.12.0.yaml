                offer templates
              properties:
                id:
                  type: integer
                  description: id of the erp selection
                variableName:
                  type: string
                  description: >
                    variable name of the erp selection.


                    This name is used in the offer template within the {ERP:...} syntax
                  example: erpAuswahl
                prompt:
                  type: string
                  description: This prompt will be shown when a user shall specify some material
                    within an offer.
                  example: Bitte geben Sie an, welches Material verwendet wird
                mats:
                  type: array
                  items:
                    description: This object represents a single source of material, which is used
                      in erp selections (inlcuding attached material infos)
                    allOf:
                      - type: object
                        description: This object represents a single source of material, which is used
                          in erp selections
                        properties:
                          id:
                            type: integer
                            description: id of the erp selection material
                          erpSelectionId:
                            type: integer
                            description: id of the associated erp selection
                          source:
                            type: string
                            description: >
                              determines the "source" for this material
                              selection (either TANSS or MENTION).


                              "articleId" determines the id of the material
                            enum:
                              - TANSS
                              - MENTION
                          articleId:
                            type: string
                            description: >
                              determines the "id" of the material.

