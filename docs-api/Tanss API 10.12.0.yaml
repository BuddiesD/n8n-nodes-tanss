    post:
      tags:
        - employees
      summary: creates an employee
      description: |
        Creates an employee
      requestBody:
        description: employee object
        required: true
        content:
          application/json:
            schema:
              description: an employe object to be saved in the database
              allOf:
                - description: object representing an employee
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                      description: full name of the employee
                    firstName:
                      type: string
                      description: first name of the employee
                    lastName:
                      type: string
                      description: last name of the employee
                    salutationId:
                      type: integer
                      description: id of the salutation for this employee
                    departmentId:
                      type: integer
                      description: id of the department which tis employee is assigned to
                    room:
                      type: string
                      description: location / room of the employee
                    telephoneNumber:
                      type: string
                      description: main telephone number
                    emailAddress:
                      type: string
                      description: e-Mail address
                    carId:
                      type: integer
                      description: if this employee is assigned to a specific car, the id goes here
                    mobilePhone:
                      type: string
                      description: mobile telephone number
                    initials:
                      type: string
                      description: initials for this employee
                    workingHourModelId:
                      type: integer
                      description: working hour model for this employee
                    accountingTypeId:
                      type: integer
                      description: id of the accounting type for this employee
                    privatePhoneNumber:
                      type: string
                      description: private telephone number
                    active:
                      type: boolean
                      description: true if the employee is active
                    erpNumber:
                      type: string
                    personalFaxNumber:
                      type: string
                      description: fax number
                    role:
                      type: string
                      description: role for this employee
                    titleId:
                      type: integer
                      description: if the employee uses a title, the id goes here
                    language:
                      type: string
                      description: language which this employee uses
                    telephoneNumberTwo:
                      type: string
                      description: second telephone number
                    mobileNumberTwo:
                      type: string
                      description: second mobile telephone number
                    restrictedUserLicense:
                      type: boolean
                      description: true, if the user has a "restricted" user license (if he/she is
                        from the own company). restricted user licenses won't
                        use a user license
                    birthday:
                      type: string
                      description: birthday in the format "YYYY-MM-DD"
                      example: 1977-12-02
                - type: object
                  properties:
                    companyAssignments:
                      type: array
                      items:
                        description: object representing an employee assignment to a company
                        type: object
                        properties:
                          companyId:
                            type: integer
                            description: id of the company, whicht he employee is assigned to
      responses:
        "201":
          description: created employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1employees/post/requestBody/content/application~1json/\
                        schema"
