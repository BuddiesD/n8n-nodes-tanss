  /api/v1/search:
    put:
      tags:
        - search
      summary: global search
      description: >
        Executes a global search, defined via the configuration object in the
        request body
      requestBody:
        description: defines the search parameters
        required: true
        content:
          application/json:
            schema:
              type: object
              description: object representing a definition for searching in misc. areas
              properties:
                areas:
                  type: array
                  description: describes in which areas to search
                  items:
                    type: string
                    description: defines the area where to search in
                    enum:
                      - COMPANY
                      - EMPLOYEE
                      - TICKET
                query:
                  type: string
                  description: the query string
                configs:
                  type: object
                  description: here, some specific search parameters can be overridden
                  properties:
                    company:
                      allOf:
                        - type: object
                          properties:
                            maxResults:
                              type: integer
                              description: maximum number of companies to fetch. If value is omitted (null),
                                then 100 max. results are used
                        - type: object
                          description: parameters which specify the company search
                    employee:
                      allOf:
                        - $ref: "#/paths/~1api~1v1~1search/put/requestBody/content/application~1json/sche\
                            ma/properties/configs/properties/company/allOf/0"
                        - type: object
                          description: parameters which specify the employee search
                          properties:
                            companyId:
                              type: integer
                              description: if only is to be searched in one company
                            inactive:
                              type: boolean
                              description: if false, inactive users won't be fetched (default = true)
                            categories:
                              type: boolean
                              description: if true, categories will be fetches as well. The names are given in
                                the "linked entities" - "employeeCategories"
                                (default = false)
                            callbacks:
                              type: boolean
                              description: if true, expected callbacks will be fetched as well (default =
                                false)
                    ticket:
                      allOf:
                        - $ref: "#/paths/~1api~1v1~1search/put/requestBody/content/application~1json/sche\
                            ma/properties/configs/properties/company/allOf/0"
                        - type: object
                          description: parameters which specify the ticket search
                          properties:
                            previewContentMaxChars:
                              type: integer
                              description: if defined, overrides the to preview the content (default values is
                                60)
                            companyId:
                              type: integer
                              description: if only is to be searched in one company
      responses:
        "200":
          description: search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: object
                    description: object representing the search results
                    properties:
                      companies:
                        type: array
                        items:
                          type: object
                          description: object containing a found company with all associated infos
                          properties:
                            id:
                              type: integer
                              description: id fo the company
                              example: 100001
                            name:
                              type: string
                              description: name of the company
                              example: HUCK IT GmbH
                            street:
                              type: string
                              description: street of the company
                              example: Am Schatzborn 1
                            postCode:
                              type: string
                              description: postal code of the company
                              example: 64380
                            city:
                              type: string
                              description: city of the company
                              example: Roßdorf
                            country:
                              type: string
                              description: country of the company
                              example: Deutschland
                            displayId:
                              type: string
                              description: display if (customer nr.)
                              example: HIT-1000001
                            phoneNumber:
                              type: string
                              description: phone number
                              example: 06154/6006-0
                            faxNumber:
                              type: string
                              description: fax number
                              example: 06154/6006-20
                            email:
                              type: string
                              description: e-Mail of the company
                              example: kontakt@huckit.de
                            website:
                              type: string
                              description: website of the company
                              example: https://www.huckit.de
                            inactive:
                              type: boolean
                              description: if the company is incative, info is given here
                            lockout:
                              type: boolean
                              description: defines, if the company is locked (n service may be entered)
                            centralType:
                              type: string
                              description: defines, if a company is a central, or a branch (or none of it)
                              enum:
                                - NONE
                                - CENTRAL
                                - BRANCH
                            personalCustomer:
                              type: boolean
                              description: defines if the company is a "private customer"
                            mobileNumber:
                              type: string
                              description: mobile phone number (only if its a private customer)
                            privateNumber:
                              type: string
                              description: private phone number (only if its a private customer)
                            types:
                              type: array
                              items:
                                $ref: "#/paths/~1api~1v1~1companyCategories~1types/get/responses/200/content/ap\
                                  plication~1json/schema/properties/content/ite\
                                  ms"
                            anticipatedCallbacks:
                              type: array
                              items:
                                type: object
                                description: gives infos about anticipated callbacks in company search results
                                properties:
                                  fromEmployeeId:
                                    type: integer
                                    description: id of the employee who waits for this callback
                                    example: 2
                                  phoneNumber:
                                    type: string
                                    description: phone number of this callback
                                    example: 06154/6006-77
                                  date:
                                    type: integer
                                    format: timestamp
                                    description: date when the anticipated callback was entered
                                    example: 1575551949
                      employees:
                        type: array
                        items:
                          type: object
                          description: object containing a found employee with all associated infos
                          properties:
                            id:
                              type: string
                              description: id of the employee
                              example: 2
                            name:
                              type: string
                              description: full (displayed) name
                              example: Mustermann, Hans
                            firstName:
                              type: string
                              description: first name
                              example: Hans
                            lastName:
                              type: string
                              description: last name
                              example: Mustermann
                            departmentId:
                              type: string
                              description: department id of the employee, the name is given in the "linked
                                entities"
                              example: 2
                            role:
                              type: string
                              description: role of the employee
                              example: Sachbearbeiter
                            phoneNr:
                              type: string
                              description: phone number
                              example: 06154/6006-123
                            phoneNr2:
                              type: string
                              description: phone number
                            email:
                              type: string
                              description: email
                              example: hans@huckit.de
                            mobileNr:
                              type: string
                              description: mobile phone number
                            mobileNr2:
                              type: string
                              description: mobile phone number
                            privateNr:
                              type: string
                              description: private phone number
                            companies:
                              type: array
                              description: shows assigned companies of this user, the name is given in the
                                "linked entities"
                              items:
                                type: integer
                              example:
                                - 100000
                                - 100001
                            active:
                              type: boolean
                              description: determines wether an employee is active or not
                            anticipatedCallbacks:
                              type: array
                              items:
                                $ref: "#/paths/~1api~1v1~1search/put/responses/200/content/application~1json/sc\
                                  hema/properties/content/properties/companies/\
                                  items/properties/anticipatedCallbacks/items"
                            categories:
                              description: ids of all employee categories (if defined in the employee search
                                configuration). The names are given in the
                                "linked entities" - "employeeCategories"
                              type: array
                              items:
                                type: integer
                      tickets:
                        type: array
                        items:
                          type: object
                          description: object containing a found ticket with all associated infos
                          properties:
                            id:
                              type: string
                              description: id of the ticket
                              example: 10345
                            title:
                              type: string
                              description: title of the ticket
                              example: Server Störung
                            content:
                              type: string
                              description: content of the ticket. This is cut by the number of
                                "previewContentMaxChars" as defined in the
                                dearch config
                              example: Versucht, den Server neuzustarten, doch es ...
                            statusId:
                              type: integer
                              description: status id, name is given in the "linked entities"
                              example: 2
                            companyId:
                              type: integer
                              description: id of the company, name is given in the "linked entities"
                              example: 100000
                            assignedToEmployeeId:
                              type: integer
                              description: assigned to employee id, name is given in the "linked entities"
                              example: 2
                            assignedToDepartmentId:
                              type: integer
                              description: assigned to department id, name is given in the "linked entities"
                            extTicketId:
                              type: string
                              description: the external ticket id (if given)
