  /api/v1/availability:
    get:
      tags:
        - availability
      summary: Fetches availability infos
      description: |
        This requests fetches information about employee availability
      parameters:
        - in: query
          name: employeeIds
          required: true
          description: Ids of the employees (comma separated)
          schema:
            type: string
      responses:
        "200":
          description: availability infos, one per employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeId:
                          type: integer
                          description: id of the employee
                        availability:
                          type: object
                          description: Representing the current "employee state", which can be set in
                            TANSS
                          properties:
                            date:
                              type: integer
                              format: timestamp
                              description: date when this state was set
                              example: 1573833600
                            employeeId:
                              type: integer
                              description: id of employee
                              example: 2
                            typeId:
                              type: integer
                              description: id of availability type
                              example: 1
                            host:
                              type: string
                              description: hostname which set this state
                              example: 127.0.0.1
                        absences:
                          type: array
                          description: list of absenced the employee has right now
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: id of this support
                              ticketId:
                                type: integer
                                description: id of the connected ticket
                              date:
                                type: integer
                                format: timestamp
                                description: beginning of the support
                              remitterId:
                                type: integer
                                description: id of the remitter (employee)
                              duration:
                                type: integer
                                description: duration of the service (in minutes)
                              location:
                                type: string
                                description: Defines, where a support takes place
                                enum:
                                  - OFFICE
                                  - CUSTOMER
                                  - REMOTE
                              linkTypeId:
                                type: integer
                                description: link type of the assignment
                              linkId:
                                type: integer
                                description: id of the assignment
                              typeId:
                                type: integer
                                description: id of the support type
                              text:
                                type: string
                                description: description / text for this support entry
                              durationNotCharged:
                                type: integer
                                description: duration which is not charged (in minutes)
                              employeeId:
                                type: integer
                                description: id of the employee who has done this support
                              planningType:
                                $ref: "#/paths/~1api~1v1~1supports~1list/put/requestBody/content/application~1j\
                                  son/schema/properties/planningTypes/items"
                              costCenterId:
                                type: integer
                                description: id of the cost center
                              reasonNotChargedText:
                                type: string
                                description: if support was not chatged, the reason / text goes here
                              reasonNotChargedId:
                                type: integersupport-model
                                description: id of the "not charged reason" (if support was completely not
                                  charged)
                              reasonPartialNotChargedId:
                                type: integer
                                description: id of the "not charged reason" (if support was partially not
                                  charged)
                        appointments:
                          type: array
                          description: list of appointments the employee has right now
                          items:
                            $ref: "#/paths/~1api~1v1~1availability/get/responses/200/content/application~1j\
                              son/schema/properties/content/items/properties/ab\
                              sences/items"
                        endInfos:
                          type: object
                          description: >
                            specific informations about absences, when they will
                            end.


                            They key ist the id of the absence, the value is an info object regarding infos
                          additionalProperties:
                            type: object
                            description: informations regarding an "end time" for a absence
                            properties:
                              timeType:
                                type: string
                                description: specifies, when an absence will end (in word TODAY, TOMORROW or
                                  TIME). The frontend can then render the result
                                  in a better way
                                enum:
                                  - TIME
                                  - TODAY
                                  - TOMORROW
                                example: TODAY
                              time:
                                type: integer
                                format: timestamp
                                description: timestamp, when the vacation/absence will end
                                example: 1573833600
                          example:
                            "1":
                              timeType: TODAY
                              time: 1573833600
