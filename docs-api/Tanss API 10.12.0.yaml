                                type: integer
                                description: size of file (in bytes)
                                example: 12312
                              employeeId:
                                type: integer
                                description: id of the employee who uploaded the file
                                example: 2
                              createdDate:
                                type: integer
                                description: timestamp of the creation (upload)
                                example: 1726749928
                              modifiedDate:
                                type: integer
                                description: timestamp of the modification
                                example: 1726749928
