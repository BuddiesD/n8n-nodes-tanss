                              cpuNumber:
                                type: integer
                                description: number of cpus
                                example: 4
                              mouseSerialNumber:
                                type: string
                                description: serial number of the mouse
                                example: ""
                              keyboadSerialNumber:
                                type: string
                                description: serial number of the keyboard
                                example: ""
                              server:
                                type: boolean
                                description: true if this pc is a server
                                example: true
                              internalRemark:
                                type: string
