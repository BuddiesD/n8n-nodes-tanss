openapi: 3.0.0
info:
  description: |
    ## Documentation of the TANSS API. Version: 10.12.0
  version: 10.12.0
  title: TANSS API
  contact:
    email: support@tanss.de
  x-logo:
    url: https://api-doc.tanss.de/logo.svg
    altText: TANSS
tags:
  - name: security
    description: Security related infos
  - name: tickets
    description: ticket module calls
  - name: ticket lists
    description: ticket list calls
  - name: ticket content
    description: ticket documents/screenshots
  - name: ticket states
    description: ticket states routes
  - name: timestamp
    description: >
      timestamp module


      These routes will be called from a "normal employee login" token.


      Only the route POST api/v1/timestamps is also available using a "timestamps token" by calling api/timestamps/v1 instead.
  - name: calls
    description: >
      These API calls belong to the "phone call api". They can't be used from a
      "normal employee login", instead an

      external API token must be created for the role "PHONE" (Telefonie).
  - name: calls (user context)
    description: >
      Routes that are used to get phone calls (usable in the user "default"
      context)
  - name: remote supports
    description: >
      These API calls belong to the "remote support api". They can't be used
      from a "normal employee login", instead an

      external API token must be created for the role "REMOTE_SUPPORT" (Fernwartung).
  - name: monitoring
    description: >
      These API calls belong to the "monitoring api". They can't be used from a
      "normal employee login", instead an

      external API token must be created for the role "MONITORING".
  - name: erp
    description: >
      These API calls belong to the "erp api". They can't be used from a "normal
      employee login", instead an

      external API token must be created for the role "ERP".
  - name: chats
    description: |
      Chat implementation
  - name: offer
    description: |
      Offer generation and templates
  - name: availability
    description: |
      Informations about employee availability
  - name: employees
    description: |
      Informations about employees
  - name: mails
    description: |
      Misc. routes regarding sending / receiving of mails
  - name: tags
    description: |
      Tag management
  - name: callback
    description: |
      Information regarding callbacks
  - name: search
    description: |
      Routes for searching in misc. areas (company, employee etc.)
  - name: checklists
    description: |
      Routes for misc. checklist operations
  - name: supports
    description: |
      Routes for misc. support entry operations
  - name: timers
    description: |
      Routes for misc. timer operations
  - name: pc
    description: >
      Device Management: pc/server


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/pcs instead of /api/v1/pcs
  - name: periphery
    description: >
      Device Management: periphery


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/peripheries instead of /api/v1/peripheries
  - name: components
    description: >
      Device Management: components


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/components instead of /api/v1/components
  - name: services
    description: >
      Device Management: services


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/services instead of /api/v1/services
  - name: ips
    description: >
      Device Management: ip addresses


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/ips instead of /api/v1/ips
  - name: company
    description: |
      Routes for companies
  - name: company category
    description: >
      Routes for company categories and types.


      A category is the overall "topic" and may contain several other actual company "types"
  - name: documents
    description: Routes for company documents.
  - name: webHooks
    description: |
      Routes used for WebHook notifications
  - name: ticket board
    description: |
      Routes used for Ticket Boards
  - name: operating systems
    description: >
      Device management: Routes used for managing operating systems


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/os instead of /api/v1/os
  - name: manufacturer
    description: >
      Device management: Routes used for managing manufacturer


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/manufacturers instead of /api/v1/manufacturers
  - name: cpus
    description: >
      Device management: Routes used for managing cpus


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/cpus instead of /api/v1/cpus
  - name: hddTypes
    description: >
      Device management: Routes used for managing hdd types


      These routes are also available using a "deviceManagement" token with the prefix /api/deviceManagement/v1/hddTypes instead of /api/v1/hddTypes
  - name: identify
    description: |
      Identifies misc. items, i.e. get a id by name. Examples:

      - Gets a manufacturer id by name
      - Gets a cpu type id by name
  - name: emailAccounts
    description: |
      Routes regarding E-Mail accounts of a company
  - name: vacationRequests
    description: |
      Routes regarding vacation requests
  - name: activityFeed
    description: |
      Routes used for activity feed
  - name: domains
    description: |
      Domain routes
paths:
  /api/v1/login:
    post:
      tags:
        - security
      summary: logs in the user and generates an api token for further authentication
      description: >
        A successful login contains two tokens,  the apiToken (apiKey) and the
        refeshToken (refresh). The apiToken will expire after 4 hours and the
        refreshToken is valid for 5 days. 

        Every request to the API must use one of these tokens in the http-header (for example ("apiToken" -> "Bearer ...";), only with the apiToken will you receive the requested resource. 
         
        If the refreshToken is used, you will get a new apiToken and refreshToken. You can use every route apart from /login and /user/login to get a new pair of tokens.The response to this request looks similar to a usual login.
      requestBody:
        description: login credentials (as json)
        required: true
        content:
          application/json:
            schema:
              description: json representing the login credentials
              type: object
              properties:
                username:
                  type: string
                  description: username / login name
                  example: sb
                password:
                  type: string
                  description: passwort for this user
                  example: secret password
                token:
                  type: string
                  description: if a two-factor-auth is used, give the token here
                  example: ""
      responses:
        "200":
          description: successful login attempt
          content:
            application/json:
              example:
                meta:
                  text: Welcome, your ApiToken is 4 hours valid.
                content:
                  employeeId: 1
                  apiKey: Bearer xyzXyZ
                  expire: 1563963819
                  refresh: Bearer exyzXYZ
                  employeeType: CUSTOMER
        "403":
          description: unsuccessful login attempt
          content:
            application/json:
              example:
                meta:
                  text: Unsuccessful login attempt
                content:
                  detailMessage: LOGIN_ERROR_INVALID_USERNAME_OR_PASSWORD
  /api/v1/tickets/own:
    get:
      tags:
        - ticket lists
      summary: gets a list of own tickets (assigned to currently logged in employee)
      description: This route gets a list of all open tickets which are assigned to
        the currently logged in employee
      responses:
        "200":
          description: list of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/200/content/app\
                        lication~1json/schema/properties/content"
                example:
                  meta:
                    id: 200
                    text: Object found
                    linkedEntities:
                      companies:
                        "100000":
                          name: "Firma #100000"
                      tickets: {}
                      ticketStates:
                        "2":
                          image: auge.gif
                          name: gesichtet
                      ticketTypes:
                        "3":
                          name: Störung
                      departments:
                        "1":
                          name: Technik
                      employees:
                        "8094":
                          initials: tm
                          name: Mitarbeiter, Test
                      phases: {}
                      orderBys: {}
                      costCenters: {}
                    properties:
                      extras:
                        departmentOrder: []
                        count: 1
                        showTicketTitle: true
                        showTicketType: false
                        waitingStates:
                          - 6
                          - 7
                          - 8
                          - 13
                          - 19
                        prefs:
                          "4":
                            "8094":
                              "2": 0
                              "100": 0
                          "20":
                            "8094":
                              "2": 0
                          "22":
                            "8094":
                              "11": 0
                              "68": 0
                          "43":
                            "8094":
                              "2": 0
                  content:
                    - id: 142953
                      companyId: 100000
                      remitterId: 0
                      title: Test Ticket Überschrift
                      content: |-
                        Dies ist eine Ticket Beschreibung.
                        Folgendes ist zu tun:
                        1.) Office installieren
                        2.) PC ausliefern
                      extTicketId: ""
                      creationDate: 1563967125
                      assignedToEmployeeId: 8094
                      assignedToDepartmentId: 1
                      statusId: 2
                      linkTypeId: 0
                      linkId: 0
                      deadlineDate: 0
                      project: false
                      projectId: 0
                      createdEmployeeId: 8094
                      typeId: 3
                      repair: false
                      reminder: 0
                      reactionHours: 0
                      dueDate: 1564046280
                      attention: NO
                      orderById: 0
                      locked: false
                      installationFee: NO
                      installationFeeAmount: 0
                      separateBilling: false
                      serviceCapAmount: 0
                      relationshipLinkTypeId: 0
                      relationshipLinkId: 0
                      resubmissionDate: 0
                      resubmissionText: ""
                      phaseId: 0
                      estimatedMinutes: 0
                      localTicketAdminFlag: NONE
                      localTicketAdminEmployeeId: 0
                      modifiedBy: 0
                      modifiedTime: 0
                      numberOfDocuments: 0
                      chats: []
                      remitterDepartmentId: 0
                      modified: 1564046280
  /api/v1/tickets/general:
    get:
      tags:
        - ticket lists
      summary: gets a list of general tickets (assigned to no employee)
      description: This route gets a list of all open tickets which are not assigned
        to any employee
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  "/api/v1/tickets/company/{companyId}":
    get:
      tags:
        - ticket lists
      summary: gets a list of company tickets
      description: This route gets a list of all tickets for a given company
      parameters:
        - in: path
          name: companyId
          description: id of the company for the tickets
          schema:
            type: integer
          required: true
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/technician:
    get:
      tags:
        - ticket lists
      summary: gets a list of tickets of all technicians
      description: This route gets a list of tickets of all technicians (excluding
        currently logged in employee)
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/repair:
    get:
      tags:
        - ticket lists
      summary: gets a list of repair tickets
      description: This route gets a list of all repair tickets
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/notIdentified:
    get:
      tags:
        - ticket lists
      summary: gets a list of not identified tickets
      description: This route gets a list of all tickets, which couldn't be assigned
        to a company and therefore are "unidentified"
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/projects:
    get:
      tags:
        - ticket lists
      summary: gets a list of all projects
      description: This route gets a list of all projects
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/localAdminOverview:
    get:
      tags:
        - ticket lists
      summary: gets a list of all tickets which are assigned to local ticket admins
      description: This route gets a list of all tickets which are "under control" of
        local ticket admins
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets/withRole:
    get:
      tags:
        - ticket lists
      summary: gets a list of all ticket which a technician has a role in
      description: This route gets a list of all tickets which the currently logged in
        technician has a role in
      responses:
        "200":
          $ref: "#/paths/~1api~1v1~1tickets~1own/get/responses/200"
  /api/v1/tickets:
    post:
      tags:
        - tickets
      summary: Creates a ticket in the database
      requestBody:
        description: ticket object to be saved
        required: true
        content:
          application/json:
            schema:
              description: ticket model to be saved
              allOf:
                - description: ticket model with all fields
                  allOf:
                    - type: object
                      properties:
                        id:
                          type: integer
                          readOnly: true
                        companyId:
                          type: integer
                          description: >
                            Company id of the ticket.

                            Name is stored in the "linked entities" - "companies".

                            Can only be set if the user has access to the company
                          x-linked-entities: companies
                          x-can-set: user needs permission for the given company
                        remitterId:
                          type: integer
                          description: >
                            If the ticket has a remitter, the id goes here.

                            Name is stored in the "linked entities" - "employees"
                          x-linked-entities: employees
                        title:
                          type: string
                          description: The title / subject of the ticket
                        content:
                          type: string
                          description: The content / description of the ticket
                        extTicketId:
                          type: string
                          description: External ticket id (optional)
                        creationDate:
                          type: integer
                          format: timestamp
                          description: creation date of tickets as unix timestamp
                          readOnly: true
                        assignedToEmployeeId:
                          type: integer
                          description: |
                            id of employee which ticket is assigned to.
                            Name is stored in "linked entities" - "employees"
                          x-linked-entities: employees
                        assignedToDepartmentId:
                          type: integer
                          description: |
                            id of department which ticket is assigned to.
                            Name is stored in "linked entities" - "departments"
                          x-linked-entities: departments
                          x-can-set: technician needs the right to assign a department for tickets
                          x-permission-id: 365
                        assignmentName:
                          type: string
                          description: If ticket is assigned to a device (or employee), here the name is
                            stored
                          readOnly: true
                        statusId:
                          type: integer
                          description: |
                            id of the ticket state.
                            Name is give in "linked entities" - "ticketStates"
                          x-linked-entities: ticketStates
                        typeId:
                          type: integer
                          description: |
                            id of the ticket type.
                            Name is give in "linked entities" - "ticketTypes"
                          x-linked-entities: ticketStates
                        linkTypeId:
                          type: integer
                          description: if ticket is assigned to device / employee, linktype is given here
                        linkId:
                          type: integer
                          description: if ticket is assigned to device / employee, the id of the entity is
                            given here
                        deadlineDate:
                          type: integer
                          format: timestamp
                          description: If ticket has a deadline, the date is given here
                          x-can-set: technician needs the right to set the deadline date
                          x-permission-id: 216
                        project:
                          type: boolean
                          description: if ticket is actually a project, this value is true
                        projectId:
                          type: integer
                          description: >
                            if ticket is a sub-ticket of a project, the id of
                            the project goes here.

                            Name of the project is in the "linked entities" - "tickets"
                          x-linked-entities: tickets
                          x-can-set: can be set if the employee has access to create sub-tickets for the
                            project
                        createdEmployeeId:
                          type: integer
                          description: id of the employee who has created this ticket
                          readOnly: true
                        repair:
                          type: boolean
                          description: if true, this ticket is a "repair ticket"
                        dueDate:
                          type: integer
                          format: timestamp
                          description: if ticket has a due date, the timestamp is given here
                          x-can-set: can be set if technician/freelancer and right to set the duedate.
                            customers can set this with the right "customer can
                            set due date"
                          x-permission-ids:
                            - 197
                            - 360
                        attention:
                          type: string
                          enum:
                            - NO
                            - YES
                            - RESUBMISSION
                            - MAIL
                          description: Determines the "attention" flag state of a ticket
                        orderById:
                          type: integer
                          description: >
                            gives infos about how the remitter gave the order.

                            Infos are stored in the "linked entities" - "orderBys"
                          x-linked-entities: orderBys
                        installationFee:
                          type: string
                          enum:
                            - NO
                            - YES
                            - NO_PROJECT_INSTALLATION_FEE
                          description: If the ticket has an installation fee, this value is true
                        installationFeeDriveMode:
                          type: string
                          enum:
                            - NONE
                            - DRIVE_INCLUDED
                            - DRIVE_EXCLUDED
                          description: >
                            Sets the installation fee drive mode.

                            If it is set to NONE then the system config parameter "leistung.ip.fahrzeit_berechnen" will be used.

                            If the company from the ticket has an installation fee drive mode set then that will be used instead of the system config parameter.
                        installationFeeAmount:
                          type: number
                          format: double
                          description: Amount for the installation fee
                        separateBilling:
                          type: boolean
                          description: If true, the ticket shall be billed separately
                        serviceCapAmount:
                          type: number
                          format: double
                          description: if the ticket has a service cap, here the amount is given
                          x-can-set: need right to autorize a new service cap
                          x-permission-id: 215
                        relationshipLinkTypeId:
                          type: integer
                          description: linkTypeId of the relationship (if ticket has a relation)
                        relationshipLinkId:
                          type: integer
                          description: linkId of the relationship (if ticket has a relation)
                        resubmissionDate:
                          type: integer
                          format: timestamp
                          description: if the ticket as a resubmission date set, this is given here
                        estimatedMinutes:
                          type: integer
                          description: Number of estimated minutes which is planned for the ticket
                        estimatedMinutesImage:
                          type: string
                          description: This is used to display the correct image for the "estimated
                            minutes" icon in the ticket lists
                          readOnly: true
                        localTicketAdminFlag:
                          type: string
                          enum:
                            - NONE
                            - LOCAL_ADMIN
                            - TECHNICIAN
                          description: >
                            Determines wether the ticket is assigned to a local
                            ticket admin or not

                            - NONE: "normal" ticket

                            - LOCAL_ADMIN: ticket is assigned to a local ticket admin

                            - TECHNICIAN: local ticket admin has forwarded the ticket to a technician
                        localTicketAdminEmployeeId:
                          type: integer
                          description: if the ticket is assigned to a local ticket admin, this represents
                            the employee (local ticket admin) who is assigned
                            for this ticket
                        phaseId:
                          type: integer
                          description: >
                            if the ticket is assignet to a project phase.

                            The name of the phase is stored in the "linked entities" - "phases"
                          x-linked-entities: phases
                        resubmissionText:
                          type: string
                          description: If a resubmission text is set, this text is returned here
                        orderNumber:
                          type: string
                          description: Sets the order number
                        reminder:
                          type: integer
                          format: timestamp
                          description: If the ticket has a reminder set, the timestamp is returned here
                          x-can-set: technicians need the right to "change reminders"
                          x-permission-id: 198
                        clearanceMode:
                          type: string
                          description: describes "how" the supports of a ticket may be cleared. Here, the
                            default value of the OSK may be "overwritten"
                          enum:
                            - DEFAULT
                            - DONT_CLEAR_SUPPORTS
                            - MAY_CLEAR_SUPPORTS
                - type: object
                  properties:
                    subTickets:
                      type: array
                      description: >
                        when persisting a project, you can also send a list of
                        sub-tickets here (optional).


                        The tickets will immediately be assigned as sub-tickets to the created project.
                      items:
                        $ref: "#/paths/~1api~1v1~1tickets/post/requestBody/content/application~1json/sc\
                          hema/allOf/0"
                    tags:
                      type: array
                      description: >
                        when persisting a ticket, you can also send a list of
                        tag assignments which will be assigned to the ticket
                      items:
                        type: object
                        description: represents a tag assignment to a persisted object
                        properties:
                          id:
                            type: integer
                            description: id of the tag
                            example: 1
      parameters:
        - in: path
          name: remitterCheck
          description: can be given to omit the check that a remitter is required when
            storing tickets
          required: false
          schema:
            type: bool
      responses:
        "201":
          description: ticket was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      linkedEntities:
                        example:
                          employees:
                            "2":
                              name: some employee name
                        type: object
                      properties:
                        type: object
                        properties:
                          fields:
                            type: object
                            example:
                              someFieldIndex: {}
                          extras:
                            type: object
                            example:
                              someExtraIndex: someExtraValue
                            additionalProperties:
                              type: object
                          editable:
                            type: boolean
                          message:
                            type: string
                      listProperties:
                        type: object
                  content:
                    description: ticket model with all fields
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            readOnly: true
                          companyId:
                            type: integer
                            description: >
                              Company id of the ticket.

                              Name is stored in the "linked entities" - "companies".

                              Can only be set if the user has access to the company
                            x-linked-entities: companies
                            x-can-set: user needs permission for the given company
                          remitterId:
                            type: integer
                            description: >
                              If the ticket has a remitter, the id goes here.

                              Name is stored in the "linked entities" - "employees"
                            x-linked-entities: employees
                          title:
                            type: string
                            description: The title / subject of the ticket
                          content:
                            type: string
                            description: The content / description of the ticket
                          extTicketId:
                            type: string
                            description: External ticket id (optional)
                          creationDate:
                            type: integer
                            format: timestamp
                            description: creation date of tickets as unix timestamp
                            readOnly: true
                          assignedToEmployeeId:
                            type: integer
                            description: |
                              id of employee which ticket is assigned to.
                              Name is stored in "linked entities" - "employees"
                            x-linked-entities: employees
                          assignedToDepartmentId:
                            type: integer
                            description: >
                              id of department which ticket is assigned to.

                              Name is stored in "linked entities" - "departments"
                            x-linked-entities: departments
                            x-can-set: technician needs the right to assign a department for tickets
                            x-permission-id: 365
                          assignmentName:
                            type: string
                            description: If ticket is assigned to a device (or employee), here the name is
                              stored
                            readOnly: true
                          statusId:
                            type: integer
                            description: |
                              id of the ticket state.
                              Name is give in "linked entities" - "ticketStates"
                            x-linked-entities: ticketStates
                          typeId:
                            type: integer
                            description: |
                              id of the ticket type.
                              Name is give in "linked entities" - "ticketTypes"
                            x-linked-entities: ticketStates
                          linkTypeId:
                            type: integer
                            description: if ticket is assigned to device / employee, linktype is given here
                          linkId:
                            type: integer
                            description: if ticket is assigned to device / employee, the id of the entity is
                              given here
                          deadlineDate:
                            type: integer
                            format: timestamp
                            description: If ticket has a deadline, the date is given here
                            x-can-set: technician needs the right to set the deadline date
                            x-permission-id: 216
                          project:
                            type: boolean
                            description: if ticket is actually a project, this value is true
                          projectId:
                            type: integer
                            description: >
                              if ticket is a sub-ticket of a project, the id of
                              the project goes here.

                              Name of the project is in the "linked entities" - "tickets"
                            x-linked-entities: tickets
                            x-can-set: can be set if the employee has access to create sub-tickets for the
                              project
                          createdEmployeeId:
                            type: integer
                            description: id of the employee who has created this ticket
                            readOnly: true
                          repair:
                            type: boolean
                            description: if true, this ticket is a "repair ticket"
                          dueDate:
                            type: integer
                            format: timestamp
                            description: if ticket has a due date, the timestamp is given here
                            x-can-set: can be set if technician/freelancer and right to set the duedate.
                              customers can set this with the right "customer
                              can set due date"
                            x-permission-ids:
                              - 197
