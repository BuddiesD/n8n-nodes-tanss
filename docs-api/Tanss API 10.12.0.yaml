  /api/v1/companies:
    post:
      tags:
        - company
      summary: Creates a new company
      description: >
        Creates a new company in TANSS.


        If the company shall be a "personal customer", you must also specify an employee object on the field "personalCustomerEmployee".
      requestBody:
        description: company object to be saved
        required: true
        content:
          application/json:
            schema:
              description: Company object to be saved.
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                      description: id of the company
                    displayId:
                      type: integer
                      description: This is the "displayed id" (=Kundennummer) of the company. The id
                        must be unique, a customer nr. could be used multiple
                        times
                      example: 100234
                    name:
                      type: string
                      description: name of the company
                      example: HUCK IT GmbH
                    matchcode:
                      type: string
                      description: matchcode (used for searching)
                      example: HUCK IT GmbH (Zentrale)
                    street:
                      type: string
                      description: street
                      example: Am Schatzborn 1
                    postcode:
                      type: string
                      description: postal code
                      example: 64380
                    city:
                      type: string
                      description: city
                      example: Roßdorf
                    country:
                      type: string
                      description: country
                      example: Deutschland
                    note:
                      type: string
                      description: a note for this company
                    headquarterId:
                      type: integer
                      description: if this company is a subsidiary, then here the id of the "central"
                        / "headquerter" company is given
                    email:
                      type: string
                      description: e-Mail
                      example: support@tanss.de
                    website:
                      type: string
                      description: website
                      example: https://www.huckit.de
                    supportInfo:
                      type: string
                      description: a support info (internal remark) can be used here
                    lockout:
                      type: boolean
                      description: if true, this company is locked
                      example: false
                    lockoutReason:
                      type: string
                      description: if company is locked, a reason can be given here
                    inactive:
                      type: boolean
                      description: If true, the company is inactive
                      example: false
                    telephone:
                      type: string
                      description: phone number
                      example: 06154/6006-0
                    telefax:
                      type: string
                      description: telefax number
                      example: 06154/6006-20
                    types:
                      type: array
                      items:
                        type: object
                        description: defines a company type
                        properties:
                          id:
                            type: integer
                            description: id of the company type
                            example: 41
                          name:
                            type: string
                            description: name of the company type
                            example: Region Süd
                          categoryId:
                            type: integer
                            description: id of the category for this type
                            example: 2
                          categoryName:
                            type: string
                            description: name of the category for this type
                            example: Regionale Gliederung
                          icon:
                            type: string
                            description: if this company type has an icon, here the name is given
                            example: region-sued.jpg
                          hidden:
                            type: boolean
                            description: if true, the company type is hidden
                - type: object
                  properties:
                    personalCustomer:
                      type: boolean
                      description: defines if this company is a "personal customer" - meaning that
                        company and employee are the same person
                    personalCustomerEmployee:
                      description: object representing an employee
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: full name of the employee
                        firstName:
                          type: string
                          description: first name of the employee
                        lastName:
                          type: string
                          description: last name of the employee
                        salutationId:
                          type: integer
                          description: id of the salutation for this employee
                        departmentId:
                          type: integer
                          description: id of the department which tis employee is assigned to
                        room:
                          type: string
                          description: location / room of the employee
                        telephoneNumber:
                          type: string
                          description: main telephone number
                        emailAddress:
                          type: string
                          description: e-Mail address
                        carId:
                          type: integer
                          description: if this employee is assigned to a specific car, the id goes here
                        mobilePhone:
                          type: string
                          description: mobile telephone number
                        initials:
                          type: string
                          description: initials for this employee
                        workingHourModelId:
                          type: integer
                          description: working hour model for this employee
                        accountingTypeId:
                          type: integer
                          description: id of the accounting type for this employee
                        privatePhoneNumber:
                          type: string
                          description: private telephone number
                        active:
                          type: boolean
                          description: true if the employee is active
                        erpNumber:
                          type: string
                        personalFaxNumber:
                          type: string
                          description: fax number
                        role:
                          type: string
                          description: role for this employee
                        titleId:
                          type: integer
                          description: if the employee uses a title, the id goes here
                        language:
                          type: string
                          description: language which this employee uses
                        telephoneNumberTwo:
                          type: string
                          description: second telephone number
                        mobileNumberTwo:
                          type: string
                          description: second mobile telephone number
                        restrictedUserLicense:
                          type: boolean
                          description: true, if the user has a "restricted" user license (if he/she is
                            from the own company). restricted user licenses
                            won't use a user license
                        birthday:
                          type: string
                          description: birthday in the format "YYYY-MM-DD"
                          example: 1977-12-02
      responses:
        "201":
          description: company was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1companies/post/requestBody/content/application~1json/\
                      schema"
