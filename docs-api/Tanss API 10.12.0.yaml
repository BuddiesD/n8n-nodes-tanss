  "/api/v1/tickets/{ticketId}/upload":
    post:
      tags:
        - ticket content
      summary: upload a document/image
      description: >
        This route lets you upload a document or image into a ticket.


        E-mails can be uploaded as well, the system will try to parse them and store them as e-mails.
      parameters:
