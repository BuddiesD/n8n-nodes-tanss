              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1timers~1notes~1%7BtimerId%7D/get/responses/200/conten\
                      t/application~1json/schema/properties/content/items"
  "/api/v1/pcs/{pcId}":
