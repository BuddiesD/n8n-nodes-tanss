      description: >
        ```xml

        <?xml version="1.0" encoding="UTF-8" ?>

        <MENTION_EXPORT type="kunden">
            <KUNDEN>
                <ROW>
                    <!-- *Pflichtfeld* -->
                    <kdnummer>KUNDENNUMMER</kdnummer>
                    <!-- *Pflichtfeld* -->
                    <kdarchiv>IN-/AKTIV | 0 = aktiv , 1 = inaktiv</kdarchiv>
