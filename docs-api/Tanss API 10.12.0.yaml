                      example: DOCUMENT
      responses:
        "200":
          description: list of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      type: object
                      description: a company document
                      properties:
                        id:
                          type: integer
                          description: id of the document
                          example: 1
                        date:
                          type: integer
                          format: timestamp
                          description: creation date of the document
                        modificationDate:
                          type: integer
                          format: timestamp
                          description: modification date of the document
                        name:
                          type: string
                          description: name of the document
                          example: Anleitung für TANSS Installation
                        type:
                          type: string
                          description: describes the type of this document
                          enum:
                            - DOCUMENT
                            - KNOWLEDGE_BASE_ARTICLE
                            - LINK
                            - FILE
                          example: DOCUMENT
                        companyId:
                          type: integer
                          description: id of the company for this document
                        createdEmployeeId:
                          type: integer
                          description: id of the employee who created this document
                        internal:
                          type: boolean
                          description: is this an internal document? (not shown for customers)
                        linkTypeId:
                          type: integer
                          description: if this document is assigned to a pc/periphery etc. - give
                            linkTypeId here
                          example: 1
                        linkType:
                          type: integer
                          description: if this document is assigned to a pc/periphery etc. - give linkId
                            here
                          example: 12312
                        encrypted:
                          type: boolean
                          description: if true, the document will be stored encrypted in the database
    post:
      tags:
        - documents
      summary: Creates a document
      requestBody:
        description: document with content
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  description: a company document
                  properties:
                    id:
                      type: integer
                      description: id of the document
                      example: 1
                    date:
                      type: integer
                      format: timestamp
                      description: creation date of the document
                    modificationDate:
                      type: integer
                      format: timestamp
                      description: modification date of the document
                    name:
                      type: string
                      description: name of the document
                      example: Anleitung für TANSS Installation
                    type:
                      type: string
                      description: describes the type of this document
                      enum:
                        - DOCUMENT
                        - KNOWLEDGE_BASE_ARTICLE
                        - LINK
                        - FILE
                      example: DOCUMENT
                    companyId:
                      type: integer
                      description: id of the company for this document
                    createdEmployeeId:
                      type: integer
                      description: id of the employee who created this document
                    internal:
                      type: boolean
                      description: is this an internal document? (not shown for customers)
                    linkTypeId:
                      type: integer
                      description: if this document is assigned to a pc/periphery etc. - give
                        linkTypeId here
                      example: 1
                    linkType:
                      type: integer
                      description: if this document is assigned to a pc/periphery etc. - give linkId
                        here
                      example: 12312
                    encrypted:
                      type: boolean
                      description: if true, the document will be stored encrypted in the database
                - type: object
                  properties:
                    content:
                      type: string
