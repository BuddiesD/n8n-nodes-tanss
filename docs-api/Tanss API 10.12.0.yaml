  /api/v1/services:
    post:
      tags:
        - services
      summary: Creates a service
      description: >
        Creates a service


        Services are used in pcs or periphery (on ip addresses) to launch an external software
      requestBody:
        description: service object to be saved
        required: true
        content:
          application/json:
            schema:
              description: represents a service (which can be assigned to an ip address on a
                pc/periphery)
              type: object
              properties:
                id:
                  type: integer
                  description: id of the service
                text:
                  type: string
                  description: name of the service
                  example: Putty
                symbol:
                  type: string
                  description: filename of the image representing the service
                  example: putty.gif
                command:
                  type: string
                  description: |
                    command which shall be executed (via batch file)

                    %1% is the placeholder which contains the ip address
                  example: C:\Programme\Putty\putty.exe\ -ssh -load "utf8" %1%"
                active:
                  type: boolean
                  description: is service active or not
                callType:
                  description: defines how a service will be executed
                  type: string
                  enum:
                    - BATCH
                    - URL
      responses:
        "201":
          description: service was succesfully inserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1services/post/requestBody/content/application~1json/s\
                      chema"
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
    get:
      tags:
        - services
      summary: Gets a list of all services
      description: |
        Gets a list of all defined services
      responses:
        "200":
          description: list of services response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1services/post/requestBody/content/application~1json/s\
                        chema"
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
