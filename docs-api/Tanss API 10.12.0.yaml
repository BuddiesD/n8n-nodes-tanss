                  type: string
                  description: filter settings for branches
                  enum:
                    - COMPANY_ONLY
                    - BRANCHES_ONLY
                    - COMPANY_AND_BRANCHES
                    - SPECIFIC_BRANCH
                textFilter:
                  type: string
                  description: text filter for documents
                types:
                  type: array
                  items:
                    - type: string
                      description: describes the type of this document
                      enum:
                        - DOCUMENT
                        - KNOWLEDGE_BASE_ARTICLE
