  /api/v1/softwarelicenses:
    put:
      tags:
        - software licenses
      summary: Get a list of software licenses
      requestBody:
        description: query parameters for retrieving supports
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/paths/~1api~1v1~1peripheries/put/requestBody/content/application~1json\
                    /schema/allOf/0"
                - type: object
                  properties:
                    softwarelicenseTypeId:
                      type: integer
                      format: integer
                      description: Periphery type (software license type id).
                    linkTypeId:
                      type: integer
                      format: integer
                      description: Link type id (assignment relation type).
                    linkId:
                      type: integer
                      format: integer
                      description: Linked entity id (device id or other target depending on
                        linkTypeId).
                    includeSubTypes:
                      type: boolean
                      description: Whether sub types should be included as well.
                      default: true
                    expiryFilter:
                      description: Defines how software licenses are filtered by expiry status.
                      type: string
                      enum:
                        - ALL
                        - ONLY_EXPIRED
                        - ONLY_NOT_EXPIRED
                        - EXPIRE_IN_60_DAYS
                        - EXPIRED_WITHOUT_RENEW
                        - EXPIRED_WITH_RENEW
                        - EXPIRES_IN_X_DAYS
                    onlyOverlicenced:
                      type: boolean
                      description: If true, return only over-licensed entries.
                      default: false
      responses:
        "200":
          description: a list of software licenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: Describes a software license
                      type: object
                      properties:
                        id:
                          type: integer
                          description: id of the software license
                        companyId:
                          type: integer
                          description: company id of the software license
                          example: 100000
                        remark:
                          type: string
                          description: misc. infos of for this software license
                          example: Virenscanner Hauptlizenz
                        internalRemark:
                          type: string
                          description: internal remarks of the license (can contain passwords), which only
                            is seen by technicians or freelancers with the given
                            permission
                          example: ""
                        serialNumber:
                          type: string
                          description: serial number
                          example: VIRUS-012-836-242-962-745
                        inventoryNumber:
                          type: string
                          description: inventory number
                          example: INV010-2021-06-05
                        softwarelicenseTypeId:
                          type: integer
                          description: id of the sofware license type
                          example: 1
                        expirationDate:
                          type: integer
                          format: timestamp
                          description: date when the software license will expire
                          example: 1659304800
                        renew:
                          type: boolean
                          description: if true, the license must be renewed upon expiring and therefore
                            needs further "attention"
                          example: true
                        date:
                          type: integer
                          format: timestamp
                          description: starting date for this software license
                          example: 1514761200
                        maxNumberOfInstall:
                          type: integer
                          description: maximum number of installations
                          example: 10
                        numberOfVolumes:
                          type: integer
                          description: number of volumes (i.e. cds)
                        active:
                          type: boolean
                          description: true if the software license is still active
                          example: true
                        employeeId:
                          type: integer
                          description: id of employee which uses this software license
                        articleNumber:
                          type: string
                          description: article number of the component
                          example: ""
                        contractPrice:
                          type: number
                          description: price which is used in maintenace contracts
                        assignments:
                          type: array
                          description: assignments of this software license to other entities
                          items:
                            description: Describes an assignment of an entity to another entity
                            type: object
                            properties:
                              linkTypeId:
                                type: integer
                                description: link type of the assignment (1=PC, 2=Company, etc.)
                              linkId:
                                type: integer
                                description: id of the linked entity (the entity to which the assignment is
                                  linked)
    post:
      tags:
        - software licenses
      summary: Creates a software license
      requestBody:
        description: software license object to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/paths/~1api~1v1~1softwarelicenses/put/responses/200/content/applicatio\
                n~1json/schema/properties/content/items"
      responses:
        "201":
          description: creted software license
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1softwarelicenses/put/responses/200/content/applicatio\
                      n~1json/schema/properties/content/items"
