  /api/v1/offers:
    put:
      tags:
        - offer
      summary: Gets list of offers
      requestBody:
        description: filter settings for the offer list
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Filter, which offers shall be loaded
              properties:
                companyId:
                  type: integer
                  description: if only offers from one company shall be fetched, give the company
                    id here
                onlyValid:
                  type: boolean
                  description: if true, only offers with a valid "validTill" shall be given
                templateId:
                  type: integer
                  description: only returns offers from this template
      description: >
        This route gets a list of offers (by a given filter, trasmitted in the
        request body)
      responses:
        "200":
          description: offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: Describes an offer, may include workflows as well
                      allOf:
                        - description: Describes an offer
                          type: object
                          properties:
                            id:
                              type: integer
                              description: id of the offer
                            name:
                              type: string
                              description: name of the offer
                              example: Angebot für TANSS
                            date:
                              type: integer
                              description: creation date of this offer
                              format: timestamp
                              example: 1573479013
                            createdByEmployeeId:
                              type: integer
                              description: id othe employee who has created this offer
                            linkTypeId:
                              type: integer
                              description: link type of the offer assignment
                            linkId:
                              type: integer
                              description: id of the offer assignment
                            validTill:
                              type: integer
                              description: date which the offer expires
                              format: timestamp
                              example: 1575154800
                        - type: object
                          properties:
                            workflows:
                              type: array
                              items:
                                description: describes a workflow contract, including the hashes
                                allOf:
                                  - type: object
                                    description: describes a workflow contract
                                    properties:
                                      id:
                                        type: integer
                                        description: id of this workflow
                                      companyId:
                                        type: integer
                                        description: id of the company for this workflow
                                      date:
                                        type: integer
                                        format: timestamp
                                        description: date, when the workflow was started
                                        example: 1573833600
                                      state:
                                        type: string
                                        description: describes the state of a workflow
                                        enum:
                                          - CREATED
                                          - REQUEST_SENT
                                          - REQUEST_SEND_ERROR
                                          - LANDING_PAGE_1_OPENED
                                          - CONTRACT_REQUESTED
                                          - LANDING_PAGE_2_OPENED
                                          - CONTRACT_DECLINED
                                          - CONTRACT_CANCELLED
                                          - CONTRACT_AVAILABLE
                                          - CONTRACT_UPLOADED_MANUALLY
                                          - STATE_SET_MANUALLY
                                  - type: object
                                    properties:
                                      tokens:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            id:
                                              type: integer
                                              description: id of this token
                                            date:
                                              type: integer
                                              format: timestamp
                                              description: date, when the token was generated
                                              example: 1573833600
                                            expires:
                                              type: integer
                                              format: timestamp
                                              description: date, when the token will expire
                                              example: 1574833600
                                            type:
                                              type: string
                                              description: describes the type of a token
                                              enum:
                                                - LANDING_PAGE_1
                                                - LANDING_PAGE_2
    post:
      tags:
        - offer
      summary: Creates an offer
      description: |
        This route creates a new offer
      requestBody:
        description: offer object
        required: true
        content:
          application/json:
            schema:
              description: Describes an offer, including variables and material
              allOf:
                - description: Describes an offer
                  type: object
                  properties:
                    id:
                      type: integer
                      description: id of the offer
                    name:
                      type: string
                      description: name of the offer
                      example: Angebot für TANSS
                    date:
                      type: integer
                      description: creation date of this offer
                      format: timestamp
                      example: 1573479013
                    createdByEmployeeId:
                      type: integer
                      description: id othe employee who has created this offer
                    linkTypeId:
                      type: integer
                      description: link type of the offer assignment
                    linkId:
                      type: integer
                      description: id of the offer assignment
                    validTill:
                      type: integer
                      description: date which the offer expires
                      format: timestamp
                      example: 1575154800
                - type: object
                  properties:
                    vars:
                      type: array
                      items:
                        type: object
                        description: Describes a variable for an offer
                        properties:
                          offerId:
                            type: integer
                            description: id of the offer
                          variableName:
                            type: string
                            description: name of the variable which is used in the offer template
                            example: anrede
                          content:
                            type: string
                            description: content of the variable
                            example: Sehr geehrte Damen und Herren
                    mats:
                      type: array
                      items:
                        type: object
                        description: Describes a material which is used in an offer
                        properties:
                          id:
                            type: integer
