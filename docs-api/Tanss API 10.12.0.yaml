                          type: string
                          example: Max Mustermann
                        salutation:
                          type: string
                          example: Herr
                        title:
                          type: string
                          example: ""
                        first_name:
                          type: string
                          example: Max
                        last_name:
                          type: string
                          example: Mustermann
                        email:
                          type: string
                          example: max@mustermann.de
                        phone_number_1:
                          type: string
                          example: ""
                        phone_number_2:
                          type: string
                          example: ""
                        mobile_number_1:
                          type: string
                          example: ""
                        mobile_number_2:
                          type: string
                          example: ""
                        fax_number:
                          type: string
                          example: ""
                        room:
                          type: string
                          example: ""
                        initials:
                          type: string
                          example: ""
                        function:
                          type: string
                          example: ""
                        active:
