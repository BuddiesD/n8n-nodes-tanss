  /api/v1/identify:
    post:
      tags:
        - identify
      summary: identifies items
      description: >
        This call lets you "identify" misc. items, i.e. get a manufacturer id by
        name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                description: A request for ideentifying misc. entities (i.e. get manufacturer id
                  by name)
                type: object
                properties:
                  items:
                    type: array
                    items:
                      description: Describes a item which is to be "identifed" by the API (i.e. get an
                        id by name)
                      type: object
                      properties:
                        linkType:
                          type: string
                          description: Enum representing the "link type" of an entity to be identifed
                          enum:
                            - PC
                            - EMPLOYEE
                            - CPU_TYPE
                            - MANUFACTURER
                            - OS
                          example: MANUFACTURER
                        identifier:
                          type: string
                          description: identifier (or name) of the entity. This will be used to search the
                            entity id.
                          example: Intel
                        searchSections:
                          type: array
                          items:
                            description: in which "sections" shall be searched
                            type: string
                            enum:
                              - NAME
                              - EMAIL
                              - DOMAIN
                              - SEARCH
      responses:
        "200":
          description: list of identified objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      description: Response containing all identified objects
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            description: This contains the identifed entity data
                            allOf:
                              - description: Describes a item which is to be "identifed" by the API (i.e. get an
                                  id by name)
                                type: object
                                properties:
                                  linkType:
                                    $ref: "#/paths/~1api~1v1~1identify/post/requestBody/content/application~1json/s\
                                      chema/items/properties/items/items/proper\
                                      ties/linkType"
                                  identifier:
                                    type: string
                                    description: identifier (or name) of the entity. This will be used to search the
                                      entity id.
                                    example: Intel
                                  searchSections:
                                    type: array
                                    items:
                                      description: in which "sections" shall be searched
                                      type: string
                                      enum:
                                        - NAME
                                        - EMAIL
                                        - DOMAIN
                                        - SEARCH
                              - type: object
                                properties:
                                  results:
                                    type: array
                                    items:
                                      description: Describes a single result for a "query item"
                                      type: object
                                      properties:
                                        linkType:
                                          $ref: "#/paths/~1api~1v1~1identify/post/requestBody/content/application~1json/s\
                                            chema/items/properties/items/items/\
                                            properties/linkType"
                                        linkId:
                                          type: integer
                                          description: retrieved "id" of the entity which was found
                                          example: 1234
                                        percent:
                                          type: integer
                                          description: (optional) if not mathcin 100%, will return a certain percentage
                                        name:
                                          type: string
                                          description: name of the entity which was found
                                          example: Intel
                                        searchSection:
                                          $ref: "#/paths/~1api~1v1~1identify/post/responses/200/content/application~1json\
                                            /schema/properties/content/items/pr\
                                            operties/items/items/allOf/0/proper\
                                            ties/searchSections/items"
                                        object:
                                          type: object
                                          description: object of the target entity (containing the actual found entity,
                                            i.e. company, cpu type,
                                            manufacturer...)
                                          example:
                                            id: 1234
                                            name: Intel
