                                type: integer
                                description: id of the mainboard manufacturer
                              mainboardManufacturerRevision:
                                type: string
                                description: revision of the mainboard
                                example: ""
                              mainboardSerialNumber:
                                type: string
                                description: serial number of the mainboard
                                example: ""
                              bios:
                                type: string
                                description: infos about the bios
                                example: ""
                              biosRelease:
                                type: string
                                description: release infos of the bios
                                example: ""
                              cpuManufacturerId:
                                type: integer
                                description: id of the cpu manufacturer
                              cpuTypeId:
                                type: integer
                                description: id of the cpu type
                                example: 1
                              cpuFrequency:
                                type: integer
