            schema:
              type: object
              description: describes an email account (mailbox)
              properties:
                id:
                  type: integer
                  example: 1
                companyId:
                  type: integer
                  description: mail account is assigned to this company
                  example: 100000
                description:
                  type: string
                  description: name of the mailbox / description
                  example: Catch-All Postfach von Firma A
                loginName:
                  type: string
                  description: login name
                  example: TestUser1
                loginPassword:
                  type: string
                  description: login password
                  example: 64gdfs_izda8!
                incomingServer:
                  type: string
                  description: name/address of the incoming mail server
                  example: pop3.test.de
                outgoingServer:
                  type: string
                  description: name/address of the outgoing mail server
                  example: smtp.test.de
                sendAttachments:
                  type: bool
                  description: are attachments sent?
                  example: true
                deleteArchived:
                  type: bool
                  description: will archived mails be sent?
                  example: true
                sendTrackingInfos:
                  type: bool
                  description: shall tracking infos be sent?
                  example: false
                catchAllAccount:
                  type: bool
                  description: is this a catch-all-mailbox?
                  example: true
                addresses:
                  type: string
                  description: list of assigned e-mail addresses (semicolon seperated)
                  example: address1@kunde.de;address2@kunde.de
                active:
                  type: bool
                  description: is this account activated?
                  example: true
                typeId:
                  type: integer
                  description: id of the account type
                  example: 1
                typeName:
                  type: string
                  description: if no existing type will match the account, you define a name for
                    the type here
                remark:
                  type: string
                  description: remark for this mail account
                linkTypeId:
                  type: integer
                  description: linkType of the assignment for this mail account
                  example: 0
                linkId:
                  type: integer
                  description: linkId of the assignment for this mail account
                  example: 0
                domainId:
                  type: integer
                  description: if the account is assigned to an domain, the id is given here
                  example: 0
