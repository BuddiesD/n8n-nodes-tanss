  /api/v1/tanssEvents/rules/test/action:
    put:
      tags:
        - webHooks
      summary: test a rule
      description: >
        This route will let you trigger an action, so you can view the result of
        the action (i.e. WebHook notification)
      requestBody:
        description: tanss event test information
        required: true
        content:
          application/json:
            schema:
              type: object
              description: defines the infos needed to trigger a rule test action
              properties:
                linkType:
                  $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                    on~1json/schema/properties/assignments/items/properties/lin\
                    kType"
                linkId:
                  type: integer
                  description: id of the assignment, for which an action shall be triggered
                    (mostly a ticket id)
                ticketNotificationOptions:
                  type: object
                  description: object containing infos needed for a ticket notification
                  properties:
                    reason:
                      type: string
                      description: reason of the ticket notification
                      enum:
                        - STATUS_CHANGED
                        - ASSIGNED_TO_ANOTHER_TECHNICIAN
                        - NEW_COMMENT
                        - NEW_SUPPORT
                        - TICKET_CREATED
                        - TICKET_REMINDER
                        - EMAIL_RECEIVED
                        - TICKET_NOT_MORE_ASSIGNED_TO_SELF
                        - NEW_SERVICE_CAP
                        - TICKET_CLOSED
                        - NEW_DUE_DATE
                        - NEW_DEADLINE
                        - CHANGED_TAGS
                    mailId:
                      type: integer
                      description: if reason is "EMAIL_RECEIVED", the id of the mail is given here
                    commentId:
                      type: integer
                      description: if reason is "NEW_COMMENT", the id of the comment is given here
                    supportId:
                      type: integer
                      description: if reason is "NEW_SUPPORT", the id of the support is given here
                action:
                  type: object
                  description: Defines an assignment from a TANSS event rule to an assignment
                    (i.e. Ticket Board Panel)
                  properties:
                    actionType:
                      type: string
                      description: defines which action shall be executed
                      enum:
                        - WEBHOOK
                    params:
                      type: object
                      description: defines the parameters for the action
                      properties:
                        url:
                          type: string
                          description: defines the url a webhook url will be sent to (actionType WEBHOOK)
                          example: http://api.tanssx.de/...
                        method:
                          type: string
                          description: defines the http method for a webhook notification (actionType
                            WEBHOOK)
                          example: POST
      responses:
        "201":
          description: rule was succesfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: object
                    description: Describes a tanss event / activity feed item
                    properties:
                      id:
                        type: integer
                      employeeId:
                        type: integer
                        description: id of the employee who this event is for
                      linkType:
                        $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                          on~1json/schema/properties/assignments/items/properti\
                          es/linkType"
                      linkId:
                        type: integer
                        description: id of the assignment, which this event refers to
                      triggerType:
                        type: string
                        description: describes the "trigger type" of an event
                        enum:
                          - TICKET_STATUS_CHANGED
                          - TICKET_ASSIGNED_TO_ANOTHER_TECHNICIAN
                          - TICKET_NEW_COMMENT
                          - TICKET_NEW_SUPPORT
                          - TICKET_CREATED
                          - TICKET_REMINDER
                          - TICKET_EMAIL_RECEIVED
                          - TICKET_NOT_MORE_ASSIGNED_TO_SELF
                          - TICKET_NEW_SERVICE_CAP
                          - TICKET_CLOSED
                          - TICKET_NEW_DUE_DATE
                          - TICKET_NEW_DEADLINE
                          - TICKET_RESUBMISSION_HIT
                          - TICKET_TAGS_CHANGED
                      content:
                        type: object
                        description: ticket content of a tanss event
                        properties:
                          ticket:
                            type: object
                            description: infos regarding a ticket which is stored as content in an tanss
                              event
