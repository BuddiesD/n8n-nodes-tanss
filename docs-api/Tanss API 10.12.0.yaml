      description: >
        if calculations have to be re-done (i.e. values have changed), then the
        "day closing"

        objects have to be re-reated. They have to be deleted first, which can be done via this route.

        After this, they can be created again (via the POST route)
      requestBody:
        description: Array of day closing identifiers (each representing the employee
