  /api/v1/timestamps/pauseConfigs:
    get:
      tags:
        - timestamp
      summary: gets a list of all pause configs
      description: >
        Defines a configuration for automatical pause subtraction.


        This is needed because longer working periods must contain certain pauses.


        In this section, those pause config objects are maintained.
      responses:
        "200":
          description: list of pause configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
