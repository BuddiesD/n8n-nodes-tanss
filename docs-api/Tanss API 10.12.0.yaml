  "/api/v1/tickets/history/{ticketId}":
    get:
      tags:
        - tickets
      summary: Gets a ticket history
      description: >
        This route will fetch a list of comments, supports and mails from a
        ticket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ticket history
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: object
                    description: object containing the ticket history
                    properties:
                      comments:
                        description: contains all comments of this ticket
                        type: array
                        items:
                          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D~1comments/post/requestBody/co\
                            ntent/application~1json/schema"
                      supports:
                        description: contains all supports of this ticket
                        type: array
                        items:
                          $ref: "#/paths/~1api~1v1~1supports~1list/put/responses/200/content/application~\
                            1json/schema/properties/content/items"
                      mails:
                        description: contains all mails of this ticket
                        type: array
                        items:
                          type: object
                          description: describes a mail object
                          properties:
                            id:
                              type: integer
                              description: id of the mail
                            senderId:
                              type: integer
                              description: id of the mail sender (if a tanss employee could be matches)
                            senderName:
                              type: string
                              description: name of the sender
                            senderEmail:
                              type: string
                              description: e-Mail of the sender
                            subject:
                              type: string
                              description: subject of the mail
                            bodyHtml:
                              type: string
                              description: html body
                            bodyPlain:
                              type: string
                              description: plain body
                            plainTextOnly:
                              type: boolean
                              description: true, if mail was sent "only plain"
                            inbound:
                              type: boolean
                              description: true, if the mail was incoming
                            internal:
                              type: boolean
                              description: true, if the mail is "internal" only
                            receivers:
                              type: array
                              items:
                                type: object
                                description: describes a mail receiver
                                properties:
                                  emailAddress:
                                    type: string
                                    description: e-Mail address of the receiver
                                  name:
                                    type: string
                                    description: name of the receiver
                                  status:
                                    type: string
                                    description: Status of the mail sending
                                    enum:
                                      - UNSENT
                                      - SENT
                                      - ERROR
                                      - RECEIVED
                                  sentDate:
                                    type: integer
                                    format: timestamp
                                    description: date, when the mail was sent
                                  method:
                                    type: string
                                    description: Method of the mail receiver (TO / CC / BCC)
                                    enum:
                                      - TO
                                      - CC
                                      - BCC
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  "/api/v1/tickets/{ticketId}/comments":
    post:
      tags:
        - tickets
      summary: Creates a comment
      description: This call will create a comment for a given ticket
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: integer
        - in: query
          name: pinned
          required: false
          schema:
            type: boolean
          description: comment can optionally be "pinned" to the ticket
      requestBody:
        description: comment to be created
        required: true
        content:
          application/json:
            schema:
              description: Defines a ticket comment
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                      description: id of the posting
                    date:
                      type: integer
                      format: timestamp
                      description: date when the posting was created (is filled automatically with the
                        current date by the API when creating items)
                    employeeId:
                      type: integer
                      description: id of the author of this posting (is filled automatically with the
                        current logged in user by the API when creating items)
                    title:
                      type: string
                      description: the title of the posting
                    content:
                      type: string
                      description: actual content / text
                    internal:
                      type: boolean
                      description: wether the posting is internal or not
                - type: object
                  properties:
                    commentOfId:
                      type: integer
                      description: the id of the ticket is given here
      responses:
        "201":
          description: comment was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D~1comments/post/requestBody/co\
                      ntent/application~1json/schema"
        "403":
          $ref: "#/paths/~1api~1v1~1tickets~1%7BticketId%7D/get/responses/403"
  "/api/v1/tickets/{ticketId}/documents":
