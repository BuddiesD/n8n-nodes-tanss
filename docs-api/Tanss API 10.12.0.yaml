                        id:
                          type: integer
                        fromMinues:
                          type: integer
                          description: Describes the amount of minutes needed to require a minimum pause
                            (defined in "minimumPause")
                          example: 360
                        minimumPause:
                          type: integer
                          description: A working period must contain at least a pause of x minutes
                          example: 30
    post:
      tags:
