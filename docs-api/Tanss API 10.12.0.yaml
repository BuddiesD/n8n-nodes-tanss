  /api/calls/v1:
    post:
      tags:
        - calls
      summary: Creates/imports a phone call into the database
      description: |
        This api call is used to import a phone call into the database.
      requestBody:
        description: call object to be saved
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object represents a phone call
              properties:
                id:
                  type: integer
                  description: id of the phone call (in the TANSS database)
                  example: 1
                callId:
                  type: string
                  description: (Optional) Describes the external id of the phone call, which is
                    used by the remote phone system
                telephoneSystemId:
                  type: integer
                  description: (Optional) If more than one remote phone systems is used,
                    represents the "number" of the phone system
                date:
                  type: integer
                  format: timestamp
                  description: Unix timestamp representing the begin of the phone call
                  example: 1514761199
                fromPhoneNumber:
                  type: string
                  description: Phone number of the caller (= "from" number)
                  example: 06154/6006-0
                fromPhoneNrInfos:
                  type: object
                  description: This object contains methods of how a phone number could be
                    assigned to a company or employee
                  properties:
                    foundType:
                      type: string
                      description: Determines how a phone number could be matched
                      enum:
                        - NONE
                        - TOO_SHORT
                        - COMPANY
                        - EMPLOYEE
                        - EMPLOYEE_INACIVE
                      example: EMPLOYEE
                    items:
                      description: all possible matches
                      type: array
                      items:
                        type: object
                        description: Determines a source of a phone number which could be retrieved from
                          a company or an employee
                        properties:
                          type:
                            $ref: "#/paths/~1api~1calls~1v1/post/requestBody/content/application~1json/sche\
                              ma/properties/fromPhoneNrInfos/properties/foundTy\
                              pe"
                          id:
                            type: integer
                            description: id of the company or employee which was found (based on the "type")
                            example: 2
                          name:
                            type: string
                            description: a string containing the name of the company or employee
                            example: Buchberger, Sven
                          active:
                            type: boolean
                            description: describes if the company or employee is still active
                          charsLeftOut:
                            type: integer
                            description: >
                              Describes how many chars were left out while doing
                              the search.

                              This could have been the case when searching for companies. In this case, some chars will be left out so that

                              number extensions can be searched as well. Example:

                              * A company has the phone number 06154/6006-0

                              * You search for a number 06154/6006-123

                              * The system will try to replace the last 3 chars of the company, so that the number could be found as well,
                                because 06154/6006-123 is an extension to 06154/6006-0
                          companyId:
                            type: integer
                            description: When searching for employees, the "main" company id of the employee
                              will be returned as well
                            example: 100000
                    result:
                      $ref: "#/paths/~1api~1calls~1v1/post/requestBody/content/application~1json/sche\
                        ma/properties/fromPhoneNrInfos/properties/items/items"
                toPhoneNumber:
                  type: string
                  description: Phone number of the called (= "to" number)
                  example: 06154/123456789-0
                toPhoneNrInfos:
                  $ref: "#/paths/~1api~1calls~1v1/post/requestBody/content/application~1json/sche\
                    ma/properties/fromPhoneNrInfos"
                direction:
                  type: string
                  description: Defines the "direction" of a phone call
                  enum:
                    - INTERNAL
                    - INCOMING
                    - OUTGOING
                  example: OUTGOING
                connectionEstablished:
                  type: boolean
                  description: True if a connection was established, otherwise will count as a
                    "try"
                durationTotal:
                  type: integer
                  description: Total duration of the call (plus ring time) in seconds
                  example: 234
                durationCall:
                  type: integer
                  description: Duration of the call (only time of actual connection) in seconds
                  example: 228
                group:
                  type: string
                  description: (Optional) A group can be assigned to the call (as a string). This
                    is an optional feature.
                phoneParticipants:
                  type: array
                  items:
                    type: object
                    description: defines a phone participant (technician)
                    properties:
                      phoneCallId:
                        type: integer
                        description: Id of the phone call
                        example: 1
                      idString:
                        type: string
                        description: >
                          Identifier string the phone system uses to represent
                          the participant (=technician). This is used to assign

                          a phone call to an employee.
                        example: 920
                      employeeId:
                        type: integer
                        description: >
                          Id of the employee, the call is assigned to. The
                          "idString" can be assigned to certain employees.

                          If this could be "translated", the actual id will be given here. If storing calls into the database and the

                          TANSS employee id is not known, then only the "idString" should be given, and upon creating the call, the system

                          will try to "translate" the "idString" into an employee id
                        example: 2
      responses:
        "201":
          description: call was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1calls~1v1/post/requestBody/content/application~1json/sche\
                      ma"
    put:
      tags:
        - calls
      summary: Get a list of phone calls
      description: >
        Retrieves a list of phone calls from the database, using misc. filter
        settings
      requestBody:
        description: filter settings
        required: true
        content:
          application/json:
            schema:
              type: object
              description: This object is used to get phone calls based on this filter
                settings
              properties:
                timeframe:
                  description: Describes a timeframe (from / to)
                  properties:
                    from:
                      type: integer
                      format: timestamp
                      description: Unix timestamp of the "from" date
                      example: 1568239200
                    to:
                      type: integer
                      format: timestamp
                      description: Unix timestamp of the "to" date
                      example: 1568325599
                showTrysAsWell:
                  type: boolean
                  description: if true, will show "tries" as well, meaning phone calls which
                    didn't have an established connection
                numberFilters:
                  type: array
                  description: one or more telephone number filters to be applied to the list
                  items:
                    type: string
                  example:
                    - 06154/6006-0
                    - 06154/123456789-0
                employeeId:
                  type: integer
                  description: only shows phone calls of a certain employee
                  example: 2
                companyId:
                  type: integer
                  description: only shows phone calls of this company
                  example: 100000
                numberInfos:
                  type: boolean
                  description: if true, then the fields "fromPhoneNrInfos" and "toPhoneNrInfos"
                    will be determined for the calls
                directions:
                  type: array
                  description: fetches for example only incoming or outgoing calls
                  items:
                    type: string
                    description: Defines the "direction" of a phone call
                    enum:
                      - INTERNAL
                      - INCOMING
                      - OUTGOING
                    example: OUTGOING
      responses:
        "200":
          description: list of all retrived phone calls
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1calls~1v1/post/requestBody/content/application~1json/sche\
                        ma"
