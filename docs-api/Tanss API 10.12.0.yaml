  /api/v1/tanssEvents/rules:
    post:
      tags:
        - webHooks
      summary: creates a rule
      description: >
        This route will create a "TANSS event rule", which is primarily used for
        webhhok notifications.
      requestBody:
        description: tanss event rule object
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                  description: defines a "name" for the rule
                  example: Benachrichtigung für Ticket Panel
                active:
                  type: boolean
                  description: true if the rule is active. If "false", rule won't trigger
                    notifications
                assignments:
                  type: array
                  description: defines for which "assignments" a rule shall be triggered
                    (currently only used for ticket board panels)
                  items:
                    type: object
                    description: Defines an assignment from a TANSS event rule to an assignment
                      (i.e. Ticket Board Panel)
                    properties:
                      linkType:
                        type: string
                        description: Enum representing the "link type" of an assignment. The id is given
                          in the field "linkId"
                        enum:
                          - PC
                          - COMPANY
                          - EMPLOYEE
                          - PERIPHERY
                          - COMPONENT
                          - SOFTWARELICENSE
                          - SUPPORT
                          - VOUCHER
                          - DOCUMENT
                          - DOCUMENT_S2T
                          - TICKET
                          - KNOWLEDGE_BASE
                          - PERMISSION
                          - PERMISSION_PACKAGE
                          - GROUP
                          - CALLBACK
                          - CONSULTATION
                          - SLA
                          - CONTRACT
                          - PREPAID_PURCHASE
                          - EVENT
                          - FILE_LINKS
                          - BIRTHDAY
                          - DOMAIN
                          - TEAMVIEWER
                          - REMOTE_SUPPORT
                          - DOCUSNAP
                          - MATERIAL
                          - CHAT
                          - TODO
                          - DOCUSNAP_SNMP
                          - VACATION_REQUEST
                          - TICKET_BOARD_PANEL
                          - DEPARTMENT
                          - COMPANY_TYPE
                          - TICKET_TYPE
                          - MAIL
                          - OFFER
                          - TICKET_STATE
                          - OVERTIME_ADDITIONAL_CHARGE
                          - CHECKLIST
                      linkId:
                        type: integer
                        description: id of the assignment
                    example:
                      linkType: TICKET_BOARD_PANEL
                      linkId: 1000
                actions:
                  type: array
                  description: defines which actions will be triggered when executing the rule
                  items:
                    type: object
                    description: Defines an assignment from a TANSS event rule to an assignment
                      (i.e. Ticket Board Panel)
                    properties:
                      actionType:
                        type: string
                        description: defines which action shall be executed
                        enum:
                          - WEBHOOK
                      params:
                        type: object
                        description: defines the parameters for the action
                        properties:
                          url:
                            type: string
                            description: defines the url a webhook url will be sent to (actionType WEBHOOK)
                            example: http://api.tanssx.de/...
                          method:
                            type: string
                            description: defines the http method for a webhook notification (actionType
                              WEBHOOK)
                            example: POST
      responses:
        "201":
          description: rule was succesfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                      on~1json/schema"
    put:
      tags:
        - webHooks
      summary: get a list of rules
      description: >
        This route will return a list of rules, matching a filter, which is sent
        in the body
      requestBody:
        description: tanss event rule filter
        required: true
        content:
          application/json:
            schema:
              type: object
              description: defines the filter for the event rule list
              properties:
                linkType:
                  $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                    on~1json/schema/properties/assignments/items/properties/lin\
                    kType"
                linkIds:
                  type: array
                  description: ids of the assignment to be filtered
                  items:
                    type: integer
      responses:
        "200":
          description: rule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/paths/~1api~1v1~1tickets/post/responses/201/content/application~1json/\
                      schema/properties/meta"
                  content:
                    type: array
                    items:
                      $ref: "#/paths/~1api~1v1~1tanssEvents~1rules/post/requestBody/content/applicati\
                        on~1json/schema"
