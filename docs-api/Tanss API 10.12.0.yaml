                              * if the source MENTION is used, this represents the id of the MENTION material
                            example: 19
                          pos:
                            type: integer
                            description: position of this material.
                            example: 1
                          type:
                            type: string
                            description: (not implemented yet, but a type can be used to determined the
                              "type" of a material)
                            enum:
