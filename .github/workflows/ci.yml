name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh lockfile for Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: 'npm ci'

      - name: Run display name check
        run: 'npm run check:display-names'

      - name: Run lint
        run: 'npm run lint'

      - name: Run format check
        run: 'npm run format'

      - name: Run build
        run: 'npm run build'
