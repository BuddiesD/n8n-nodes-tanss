name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify versions
        run: |
          node -v
          npm -v
          npx --yes npm@^11.5.1 -v
    
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format

      - name: Run build
        run: npm run build

      - name: Publish to npm
        run: npx --yes npm@^11.5.1 publish --provenance --ignore-scripts